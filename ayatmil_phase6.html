      N.count.dataset.remainingMs = String(Math.round(ms));
    }
    function setBar(progress, startTxt, endTxt, gap) {
      const pct = Math.floor(progress * 100);
      N.fill.style.width = (progress * 100).toFixed(2) + '%';
      N.bar.setAttribute('aria-valuenow', String(pct));
      N.bar.classList.toggle('pt-bar-gap', !!gap);
      N.bp.textContent = bn(pct) + '%'; N.bs.textContent = startTxt; N.be.textContent = endTxt;
    }

    function renderNow(tl, plan) {
      N.date.textContent = fmtDateBn(plan.ymd, plan.tz);
      N.loc.textContent = state.location.name + (state.location.source === 'default' ? ' (ডিফল্ট লোকেশন)' : '');
      N.next.textContent = ''; N.note.textContent = '';
      const rows = N.body.querySelectorAll('tr[data-key]');
      rows.forEach(r => r.classList.remove('pt-row-current', 'pt-row-next'));
      if (tl.state === 'waqt') {
        const w = WAQT_BY_KEY[tl.current.key];
        N.state.textContent = 'এখন চলছে'; N.state.className = 'pt-now-state pt-st-waqt';
        N.name.textContent = w.bn;
        N.label.textContent = 'ওয়াক্ত শেষ হতে বাকি';
        setCount(tl.remainingMs);
        setBar(tl.progress, 'শুরু ' + tm(tl.current.start, plan), 'শেষ ' + tm(tl.current.end, plan), false);
        if (tl.current.dayKey !== plan.dateKey) N.note.textContent = 'গতকাল শুরু হওয়া ' + w.bn + 'র ওয়াক্ত এখনো চলছে।';
        else if (tl.current.key === 'fajr') N.note.textContent = 'ফজরের ওয়াক্ত সূর্যোদয়ে শেষ হয়। সূর্যোদয় থেকে যোহর শুরু পর্যন্ত কোনো ফরজ ওয়াক্ত নেই।';
        if (tl.next) {
          const nw = WAQT_BY_KEY[tl.next.key];
          N.next.textContent = 'পরবর্তী ওয়াক্ত: ' + nw.bn + ' — ' + tm(tl.next.start, plan);
        }
        if (tl.current.dayKey === plan.dateKey) { const r = N.body.querySelector('tr[data-key="' + tl.current.key + '"]'); if (r) r.classList.add('pt-row-current'); }
        if (tl.next && tl.next.dayKey === plan.dateKey) { const r = N.body.querySelector('tr[data-key="' + tl.next.key + '"]'); if (r) r.classList.add('pt-row-next'); }
      } else if (tl.state === 'gap') {
        const nw = WAQT_BY_KEY[tl.next.key];
        N.state.textContent = 'এখন কোনো ফরজ ওয়াক্ত নয়'; N.state.className = 'pt-now-state pt-st-gap';
        N.name.textContent = tl.kind === 'sunrise' ? 'সূর্যোদয় থেকে যোহর পর্যন্ত' : 'দুই ওয়াক্তের মধ্যবর্তী সময়';
        N.label.textContent = nw.gen + ' ওয়াক্ত শুরু হতে বাকি';
        setCount(tl.remainingMs);
        setBar(tl.progress, tl.gapStart != null ? tm(tl.gapStart, plan) : '', 'শুরু ' + tm(tl.next.start, plan), true);
        N.next.textContent = 'পরবর্তী ওয়াক্ত: ' + nw.bn + ' — ' + tm(tl.next.start, plan);
        if (tl.kind === 'sunrise') N.note.textContent = 'ফজরের ওয়াক্ত শেষ হয়েছে। যোহর শুরু হওয়া পর্যন্ত কোনো ফরজ ওয়াক্ত নেই।';
        if (tl.next.dayKey === plan.dateKey) { const r = N.body.querySelector('tr[data-key="' + tl.next.key + '"]'); if (r) r.classList.add('pt-row-next'); }
      } else {
        N.state.textContent = 'ওয়াক্ত নির্ণয় করা যায়নি'; N.state.className = 'pt-now-state pt-st-gap';
        N.name.textContent = '—'; N.label.textContent = ''; N.count.textContent = ''; N.count.dataset.remainingMs = '';
        setBar(0, '', '', true);
        N.note.textContent = plan.warnings[0] || 'এই লোকেশন ও সেটিংসে সময় গণনা করা যায়নি।';
      }
    }

    function livePlanFor(nowMs) {
      const S = state.settings, tz = resolveTz(S);
      const ymd = ymdInTz(new Date(nowMs), tz);
      const key = ymdKey(ymd) + '|' + tz + '|' + stateVersion;
      if (key !== livePlanKey) {            // তারিখ বদলালে (মধ্যরাত) বা লোকেশন/সেটিংস বদলালে পুনর্গণনা
        livePlan = buildPlan(ymd, state.location, S); livePlanKey = key; renderDaily(livePlan); renderExtras(livePlan); renderStrip(livePlan); renderDates(livePlan);
      }
      return livePlan;
    }
    function liveTick() {
      clearTimeout(liveTimer);
      try {
        const now = Date.now();
        const plan = livePlanFor(now);
        if (!document.hidden) { renderNow(timelineAt(plan, now), plan); updateExtras(plan, now); mqUpdate(plan, now); }
      } catch (e) { console.error('live tick failed:', e); }
      liveTimer = setTimeout(liveTick, 1000 - (Date.now() % 1000) + 8);   // সেকেন্ডের সীমানায় ঠিক করা, ড্রিফট নেই
    }
    function refreshLive() { livePlanKey = ''; liveTick(); }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) liveTick(); });
    window.addEventListener('focus', liveTick);
    window.addEventListener('pageshow', liveTick);

    // ═══════════ Phase 4: নফল ও মাকরুহ সময় (লাইভ অবস্থা) ═══════════
    const X = { nafl: $(root, '#pt-nafl-table tbody'), naflHint: $(root, '#pt-nafl-hint'),
                mk: $(root, '#pt-mk-table tbody'), mkHint: $(root, '#pt-mk-hint'), mkSum: $(root, '#pt-mk-sum') };
    const LABEL = { tahajjud: 'তাহাজ্জুদ', lastthird: 'রাতের শেষ এক-তৃতীয়াংশ', ishraq: 'ইশরাক', chasht: 'চাশত (দুহা)',
                    duha: 'ইশরাক ও চাশত (দুহা)', awwabin: 'আওয়াবিন (প্রস্তাবিত সময়)',
                    mk_sunrise: 'সূর্যোদয়', mk_istiwa: 'ইস্তিওয়া (যোহরের আগের মাকরুহ সময়)', mk_sunset: 'সূর্যাস্ত' };
    const SHORT = { mk_sunrise: 'সূর্যোদয়ের', mk_istiwa: 'ইস্তিওয়ার', mk_sunset: 'সূর্যাস্তের' };
    let extraRows = [];

    function durText(ms) {
      const d = splitDuration(ms), p = [];
      if (d.h > 0) p.push(bn(pad2(d.h)) + ' ঘণ্টা');
      if (d.h > 0 || d.m > 0) p.push(bn(pad2(d.m)) + ' মিনিট');
      p.push(bn(pad2(d.s)) + ' সেকেন্ড');
      return p.join(' ');
    }
    // কোন উইন্ডো দেখানো হবে: তাহাজ্জুদ = চলমান বা পরবর্তী রাত; বাকি = আজকের তারিখের
    function pickWindow(plan, id, now) {
      if (id === 'tahajjud') { const s = windowStatus(plan, 'tahajjud', now); return s.cur || s.next || s.prev; }
      if (id === 'lastthird') {
        const tj = pickWindow(plan, 'tahajjud', now);
        return tj ? (plan.windows.find(w => w.id === 'lastthird' && w.end === tj.end) || null) : null;
      }
      return plan.windows.find(w => w.id === id && w.dayKey === plan.dateKey) || null;
    }
    function addRows(body, ids) {
      body.textContent = '';
      return ids.map(id => {
        const tr = el('tr'); tr.dataset.id = id;
        if (id === 'lastthird') tr.className = 'pt-row-sub';
        const th = el('th'); th.scope = 'row'; th.appendChild(el('span', 'pt-pn', LABEL[id]));
        const td = el('td', 'pt-ext');
        const range = el('div', 'pt-range', '—'), stat = el('div', 'pt-stat', '');
        td.appendChild(range); td.appendChild(stat); tr.appendChild(th); tr.appendChild(td); body.appendChild(tr);
        return { id, tr, range, stat };
      });
    }
    function para(parent, text, cls) { const p = el('p', 'pt-hint' + (cls ? ' ' + cls : ''), text); parent.appendChild(p); }

    function renderExtras(plan) {
      const S = plan.today ? plan.today.settings : state.settings, nf = S.nafl, mk = S.makruh;
      const naflIds = nf.duhaMode === 'combined' ? ['tahajjud', 'lastthird', 'duha', 'awwabin'] : ['tahajjud', 'lastthird', 'ishraq', 'chasht', 'awwabin'];
      const mkIds = ['mk_sunrise', 'mk_istiwa', 'mk_sunset'];
      extraRows = addRows(X.nafl, naflIds).concat(addRows(X.mk, mkIds));
      X.naflHint.textContent = ''; X.mkHint.textContent = '';
      para(X.naflHint, 'তাহাজ্জুদ: ইশা থেকে ফজর শুরু পর্যন্ত নামাজের সময়সীমা। ঘুমের শর্ত অ্যাপ যাচাই করতে পারে না, তাই এটি শুধু সময়সীমা হিসেবে দেখানো হয়েছে। রাতের শেষ এক-তৃতীয়াংশ আলাদা হাইলাইট করা হয়েছে; রাত ধরা হয়েছে ' +
        (nf.nightDef === 'maghribFajr' ? 'মাগরিব থেকে ফজর' : 'সূর্যাস্ত থেকে সূর্যোদয়') + ' পর্যন্ত।');
      para(X.naflHint, 'ইশরাক ও চাশত (দুহা): হানাফি ব্যাখ্যায় এগুলো একই নামাজের সময়ের ভিন্ন পর্যায়। এখানে দুটিকে আবশ্যক পৃথক নামাজ হিসেবে নয়, শুধু সময়ের পর্যায় হিসেবে দেখানো হয়েছে।');
      if (nf.duhaMode === 'separate') {
        para(X.naflHint, 'চাশতের শুরু: ' + (nf.chashtMode === 'quarter'
          ? (nf.dayDef === 'sun' ? 'সূর্যোদয় থেকে সূর্যাস্ত' : 'ফজর থেকে মাগরিব') + ' পর্যন্ত দিনের এক-চতুর্থাংশ অতিক্রান্ত হওয়ার পর'
          : 'সূর্যোদয়ের ' + bn(nf.chashtMinutes) + ' মিনিট পর') + '; শেষ ইস্তিওয়ার মাকরুহ সময় শুরুর আগে।');
      } else para(X.naflHint, 'ইশরাক ও চাশত একত্রে: সূর্যোদয়ের মাকরুহ সময় শেষ থেকে ইস্তিওয়ার মাকরুহ সময় শুরুর আগ পর্যন্ত।');
      para(X.naflHint, 'আওয়াবিন: মাগরিব থেকে ' + (nf.awwabinEnd === 'isha' ? 'ইশার শুরু' : 'মাগরিবের ' + bn(nf.awwabinMinutes) + ' মিনিট পর') +
        ' পর্যন্ত প্রস্তাবিত সময়। এর নামকরণ ও ফিকহি ব্যাখ্যায় মতভেদ আছে।');
      para(X.mkHint, 'সূর্যোদয় (' + bn(mk.sunriseMin) + ' মিনিট) ও সূর্যাস্ত (' + bn(mk.sunsetMin) + ' মিনিট) আনুমানিক সতর্কতামূলক সময়। আলেমভেদে ভিন্ন মিনিট বলা হয়; এটি সর্বত্র নির্দিষ্ট শরিয়াহ-নির্ধারিত মিনিট নয়। সেটিংসে ১০–৩০ মিনিটের মধ্যে পরিবর্তনযোগ্য।');
      para(X.mkHint, 'ইস্তিওয়া: প্রকৃত সৌর মধ্যাহ্নের ' + bn(mk.istiwaBeforeMin) + ' মিনিট আগে থেকে যোহরের শুরু পর্যন্ত। যোহরের শুরু প্রকৃত সৌর মধ্যাহ্নের আগে ধরা হয় না, তাই এই দুই সময় কখনো ওভারল্যাপ করে না। সূর্যোদয়ের সময়সীমা ফজরের শেষ মুহূর্ত থেকে শুরু, আর সূর্যাস্তের সময়সীমা আসরের শেষ মুহূর্তে শেষ।');
      if (plan.warnings.some(w => w.indexOf('clamp') === 0 || w.indexOf('empty') === 0 || w.indexOf('overlap') === 0))
        para(X.mkHint, '⚠ সেটিংস বা মিনিট-সমন্বয়ের কারণে ওভারল্যাপ এড়াতে কিছু সীমা সংশোধিত হয়েছে।', 'pt-warn');
      updateExtras(plan, Date.now());
    }

    function updateExtras(plan, now) {
      if (!plan.valid) { extraRows.forEach(r => { r.range.textContent = '—'; r.stat.textContent = ''; }); X.mkSum.textContent = ''; return; }
      extraRows.forEach(r => {
        const w = pickWindow(plan, r.id, now);
        r.tr.classList.remove('pt-row-current');
        if (!w) { r.range.textContent = '—'; r.stat.textContent = ''; r.stat.className = 'pt-stat'; return; }
        r.range.textContent = tm(w.start, plan) + ' – ' + tm(w.end, plan);
        r.range.dataset.start = w.start; r.range.dataset.end = w.end;
        if (now >= w.start && now < w.end) {
          r.stat.textContent = 'চলছে · শেষ হতে ' + durText(w.end - now); r.stat.className = 'pt-stat pt-stat-now';
          r.tr.classList.add('pt-row-current'); r.stat.dataset.remainingMs = String(w.end - now);
        } else if (w.start > now) {
          r.stat.textContent = 'শুরু হতে ' + durText(w.start - now); r.stat.className = 'pt-stat pt-stat-next'; r.stat.dataset.remainingMs = String(w.start - now);
        } else { r.stat.textContent = 'শেষ হয়েছে'; r.stat.className = 'pt-stat pt-stat-past'; r.stat.dataset.remainingMs = ''; }
      });
      const s = makruhSummary(plan, now);
      if (s.cur) { X.mkSum.textContent = 'এখন মাকরুহ সময় চলছে: ' + LABEL[s.cur.id] + ' — শেষ হতে ' + durText(s.cur.end - now); X.mkSum.className = 'pt-mk-sum pt-mk-now'; X.mkSum.dataset.id = s.cur.id; X.mkSum.dataset.remainingMs = String(s.cur.end - now); }
      else if (s.next) { X.mkSum.textContent = 'এখন মাকরুহ সময় নয়। পরবর্তী: ' + LABEL[s.next.id] + ' — ' + tm(s.next.start, plan) + ' থেকে, শুরু হতে ' + durText(s.next.start - now); X.mkSum.className = 'pt-mk-sum'; X.mkSum.dataset.id = s.next.id; X.mkSum.dataset.remainingMs = String(s.next.start - now); }
      else { X.mkSum.textContent = ''; }
    }

    // ───── নফল ও মাকরুহ সেটিংস ফর্ম ─────
    const P4 = { sr: $(root, '#p4-sr'), ss: $(root, '#p4-ss'), ib: $(root, '#p4-ib'), duha: $(root, '#p4-duha'), chmode: $(root, '#p4-chmode'),
                 chmin: $(root, '#p4-chmin'), day: $(root, '#p4-day'), awend: $(root, '#p4-awend'), awmin: $(root, '#p4-awmin'), night: $(root, '#p4-night') };
    const p4Msg = (t, kind) => { const e = $(root, '#p4-msg'); e.textContent = t || ''; e.className = 'pt-msg' + (kind ? ' pt-msg-' + kind : ''); };
    function fillP4Form() {
      const mk = state.settings.makruh, nf = state.settings.nafl;
      P4.sr.value = mk.sunriseMin; P4.ss.value = mk.sunsetMin; P4.ib.value = mk.istiwaBeforeMin;
      P4.duha.value = nf.duhaMode; P4.chmode.value = nf.chashtMode; P4.chmin.value = nf.chashtMinutes; P4.day.value = nf.dayDef;
      P4.awend.value = nf.awwabinEnd; P4.awmin.value = nf.awwabinMinutes; P4.night.value = nf.nightDef;
    }
    $(root, '#p4-save').addEventListener('click', () => {
      const v = (inp, lo, hi) => { const n = num(inp.value, NaN); return (n >= lo && n <= hi) ? Math.round(n) : null; };
      const sr = v(P4.sr, 10, 30), ss = v(P4.ss, 10, 30), ib = v(P4.ib, 0, 10), cm = v(P4.chmin, 30, 240), am = v(P4.awmin, 15, 180);
      if (sr === null || ss === null) { p4Msg('সূর্যোদয় ও সূর্যাস্তের মাকরুহ সময় ১০ থেকে ৩০ মিনিটের মধ্যে হতে হবে।', 'err'); return; }
      if (ib === null) { p4Msg('ইস্তিওয়ার মিনিট ০ থেকে ১০-এর মধ্যে হতে হবে।', 'err'); return; }
      if (cm === null) { p4Msg('চাশতের নির্দিষ্ট মিনিট ৩০ থেকে ২৪০-এর মধ্যে হতে হবে।', 'err'); return; }
      if (am === null) { p4Msg('আওয়াবিনের নির্দিষ্ট মিনিট ১৫ থেকে ১৮০-এর মধ্যে হতে হবে।', 'err'); return; }
      const r = setSettings({ ...state.settings,
        makruh: { sunriseMin: sr, sunsetMin: ss, istiwaBeforeMin: ib },
        nafl: { duhaMode: P4.duha.value, chashtMode: P4.chmode.value, chashtMinutes: cm, dayDef: P4.day.value,
                awwabinEnd: P4.awend.value, awwabinMinutes: am, nightDef: P4.night.value } });
      fillP4Form(); refreshLive();
      p4Msg(r.ok ? 'নফল ও মাকরুহ সেটিংস সংরক্ষিত হয়েছে।' : 'প্রয়োগ হয়েছে, কিন্তু স্থায়ীভাবে সংরক্ষণ করা যায়নি।', r.ok ? 'ok' : 'warn');
    });
    $(root, '#p4-reset').addEventListener('click', () => {
      const r = setSettings({ ...state.settings, makruh: clone(DEFAULT_SETTINGS.makruh), nafl: clone(DEFAULT_SETTINGS.nafl) });
      fillP4Form(); refreshLive();
      p4Msg(r.ok ? 'নফল ও মাকরুহ সেটিংস ডিফল্টে ফিরেছে।' : 'ডিফল্টে ফেরা হয়েছে, কিন্তু সংরক্ষণ করা যায়নি।', r.ok ? 'ok' : 'warn');
    });

    // ═══════════ Phase 5: সাহরি শেষ, ইশরাক, ইফতার ═══════════
    const T = { sahri: $(root, '#pt-t-sahri'), ishraq: $(root, '#pt-t-ishraq'), ishraqS: $(root, '#pt-t-ishraq-s'), iftar: $(root, '#pt-t-iftar') };
    // সাহরি শেষ = ফজরের ওয়াক্ত শুরু; ইশরাক = সূর্যোদয়ের মাকরুহ সময় শেষ (Phase 4); ইফতার = মাগরিবের ওয়াক্ত শুরু (সূর্যাস্ত)
    function renderStrip(plan) {
      const set = (elm, ms) => { elm.textContent = ms != null ? fmtTime(new Date(ms), plan.tz) : '—'; elm.dataset.ts = ms != null ? String(ms) : ''; };
      if (!plan.valid) { set(T.sahri, null); set(T.ishraq, null); set(T.iftar, null); return; }
      const per = k => plan.periods.find(p => p.key === k && p.dayKey === plan.dateKey);
      const ish = plan.windows.find(w => (w.id === 'ishraq' || w.id === 'duha') && w.dayKey === plan.dateKey);
      set(T.sahri, per('fajr') ? per('fajr').start : null);
      set(T.ishraq, ish ? ish.start : null);
      set(T.iftar, per('maghrib') ? per('maghrib').start : null);
      T.ishraqS.textContent = 'সূর্যোদয়ের ' + bn(plan.today.settings.makruh.sunriseMin) + ' মিনিট পর';
    }

    // ═══════════ Phase 6: তারিখ (ইংরেজি, বাংলা, হিজরি) ═══════════
    const HJ = { en: $(root, '#pt-d-en'), bn: $(root, '#pt-d-bn'), hj: $(root, '#pt-d-hj'), sep: $(root, '.pt-d-sep'), toggle: $(root, '#pt-hj-toggle'), row: $(root, '#pt-hj-adj') };
    function renderDates(plan) {
      const adj = state.settings.hijriAdjust, B = banglaFor(plan.ymd), H = hijriFor(plan.ymd, adj);
      HJ.en.textContent = enDate(plan.ymd);
      HJ.bn.textContent = B ? bn(B.d) + ' ' + BN_MONTHS[B.m] + ' ' + bn(B.y) + ' বঙ্গাব্দ' : '';
      HJ.hj.textContent = H ? bn(H.d) + ' ' + HIJRI_MONTHS_BN[H.m - 1] + ' ' + bn(H.y) + ' হিজরি' + (adj ? ' (' + (adj > 0 ? '+' : '−') + '১ দিন সমন্বিত)' : '') : '';
      HJ.hj.dataset.adj = String(adj);
      HJ.sep.hidden = !(B && H); HJ.toggle.hidden = !H;
      if (!H) HJ.row.hidden = true;
      HJ.row.querySelectorAll('button[data-adj]').forEach(b => {
        const on = Number(b.dataset.adj) === adj; b.setAttribute('aria-checked', String(on)); b.classList.toggle('pt-seg-on', on);
      });
    }
    HJ.toggle.addEventListener('click', () => {
      HJ.row.hidden = !HJ.row.hidden; HJ.toggle.setAttribute('aria-expanded', String(!HJ.row.hidden));
      HJ.toggle.textContent = HJ.row.hidden ? 'সমন্বয়' : 'বন্ধ করুন';
    });
    HJ.row.addEventListener('click', e => {
      const b = e.target.closest('button[data-adj]'); if (!b) return;
      setSettings({ ...state.settings, hijriAdjust: Number(b.dataset.adj) }); refreshLive();
    });

    // লোকেশন কার্ড: ডিফল্টে লুকানো, "লোকেশন বদলান" চাপলে খোলে
    const locCard = $(root, '#pt-loc-card'), locBtn = $(root, '#pt-loc-toggle');
    locBtn.addEventListener('click', () => {
      locCard.hidden = !locCard.hidden;
      locBtn.setAttribute('aria-expanded', String(!locCard.hidden));
      locBtn.textContent = locCard.hidden ? 'লোকেশন বদলান' : 'লোকেশন লুকান';
    });

    // ═══════════ Phase 5: মসজিদ ও জামাত (UI) ═══════════
    const Q = { chips: $(root, '#pt-mq-chips'), empty: $(root, '#pt-mq-empty'), panel: $(root, '#pt-mq-panel'), name: $(root, '#pt-mq-name'),
      rows: $(root, '#pt-mq-rows'), who: $(root, '#pt-mq-sum-who'), count: $(root, '#pt-mq-count'), started: $(root, '#pt-mq-started'),
      addBtn: $(root, '#pt-mq-add-btn'), addForm: $(root, '#pt-mq-addform'), addIn: $(root, '#pt-mq-new-name'), addMsg: $(root, '#pt-mq-add-msg'),
      editBtn: $(root, '#pt-mq-edit-btn'), editForm: $(root, '#pt-mq-editform'), editIn: $(root, '#pt-mq-edit-name'), editMsg: $(root, '#pt-mq-edit-msg'),
      delBtn: $(root, '#pt-mq-del-btn'), delForm: $(root, '#pt-mq-delform'), delText: $(root, '#pt-mq-del-text'), saveMsg: $(root, '#pt-mq-save-msg') };
    let mqRows = {};
    const dayLabel = (ms, plan) => { const d = dayDiff(plan.ymd, ymdInTz(new Date(ms), plan.tz)); return d === 0 ? 'আজ' : d === 1 ? 'আগামীকাল' : d === -1 ? 'গতকাল' : ''; };
    function countHtml(ms) {
      const d = splitDuration(ms), parts = [];
      const add = (v, unit) => { parts.push('<span class="pt-cn">' + bn(pad2(v)) + '</span> <span class="pt-cu">' + unit + '</span>'); };
      if (d.h > 0) add(d.h, 'ঘণ্টা');
      if (d.h > 0 || d.m > 0) add(d.m, 'মিনিট');
      add(d.s, 'সেকেন্ড');
      return parts.join(' ');
    }
    function mqNote(res) {
      Q.saveMsg.textContent = (res && res.ok && res.saved === false) ? 'ব্রাউজারে স্টোরেজ বন্ধ থাকায় তথ্য স্থায়ীভাবে সংরক্ষণ করা যায়নি; রিলোডের পর হারিয়ে যেতে পারে।' : '';
      Q.saveMsg.className = 'pt-msg pt-msg-warn';
    }
    function mqRender() {
      const ms = mosqueState.mosques, sel = selectedMosque();
      Q.chips.textContent = '';
      ms.forEach(mo => {
        const on = !!(sel && sel.id === mo.id);
        const b = el('button', 'pt-chip pt-mq-chip' + (on ? ' pt-chip-on' : ''), mo.name);
        b.type = 'button'; b.dataset.id = mo.id; b.setAttribute('aria-pressed', String(on)); Q.chips.appendChild(b);
      });
      Q.empty.hidden = ms.length > 0; Q.panel.hidden = !sel; Q.editForm.hidden = true; Q.delForm.hidden = true;
      Q.rows.textContent = ''; mqRows = {};
      if (sel) {
        Q.name.textContent = sel.name;
        JAMAAT_KEYS.forEach(k => {
          const nm = WAQT_BY_KEY[k].bn;
          const row = el('div', 'pt-mq-row'); row.dataset.key = k;
          const lab = el('label', 'pt-mq-rl', nm); lab.htmlFor = 'pt-mq-t-' + k;
          const inp = el('input', 'pt-input pt-mq-time'); inp.type = 'time'; inp.id = 'pt-mq-t-' + k; inp.value = sel.jamaat[k]; inp.dataset.key = k;
          inp.setAttribute('aria-label', nm + ' জামাতের সময়');
          const clr = el('button', 'pt-btn pt-btn-sm pt-mq-clr', '✕'); clr.type = 'button'; clr.dataset.key = k; clr.setAttribute('aria-label', nm + ' জামাতের সময় মুছুন');
          const stat = el('div', 'pt-mq-stat'), warn = el('div', 'pt-mq-warn');
          row.appendChild(lab); row.appendChild(inp); row.appendChild(clr); row.appendChild(stat); row.appendChild(warn); Q.rows.appendChild(row);
          mqRows[k] = { row, inp, clr, stat, warn };
        });
      }
      mqUpdate(livePlan, Date.now());
    }
    function mqUpdate(plan, now) {
      const sel = selectedMosque();
      if (!sel || !plan) return;
      const js = jamaatStatus(plan, sel, now);
      JAMAAT_KEYS.forEach(k => {
        const r = js.rows[k], ui = mqRows[k]; if (!ui) return;
        ui.clr.hidden = (r.state === 'none');
        ui.row.classList.toggle('pt-mq-next', !!(js.next && js.next.key === k && js.next.dayKey === plan.dateKey));
        ui.stat.dataset.state = r.state; ui.stat.dataset.remainingMs = '';
        if (r.state === 'none') { ui.stat.textContent = 'জামাতের সময় দিন'; ui.stat.className = 'pt-mq-stat pt-mq-st-none'; }
        else if (r.state === 'upcoming') { ui.stat.textContent = 'জামাত শুরু হতে ' + durText(r.remainingMs); ui.stat.className = 'pt-mq-stat pt-mq-st-up'; ui.stat.dataset.remainingMs = String(r.remainingMs); }
        else if (r.state === 'started') { ui.stat.textContent = 'জামাত শুরু হয়েছে'; ui.stat.className = 'pt-mq-stat pt-mq-st-started'; }
        else { ui.stat.textContent = 'শেষ হয়েছে'; ui.stat.className = 'pt-mq-stat pt-mq-st-past'; }
        ui.warn.textContent = r.outside ? '⚠ এই সময় ওয়াক্তের সময়সীমার বাইরে' : '';
      });
      if (js.next) {
        const w = WAQT_BY_KEY[js.next.key];
        Q.who.textContent = 'পরবর্তী জামাত: ' + w.bn + ' — ' + dayLabel(js.next.ts, plan) + ' ' + fmtTime(new Date(js.next.ts), plan.tz);
        Q.count.innerHTML = countHtml(js.next.remainingMs); Q.count.dataset.remainingMs = String(js.next.remainingMs); Q.count.dataset.key = js.next.key;
      } else {
        Q.who.textContent = 'জামাতের সময় দিলে এখানে কাউন্টডাউন দেখাবে।';
        Q.count.textContent = ''; Q.count.dataset.remainingMs = ''; Q.count.dataset.key = '';
      }
      if (js.started) {
        const w = WAQT_BY_KEY[js.started.key];
        Q.started.textContent = w.bn + ' জামাত শুরু হয়েছে (' + dayLabel(js.started.ts, plan) + ' ' + fmtTime(new Date(js.started.ts), plan.tz) + ')';
        Q.started.dataset.key = js.started.key;
      } else { Q.started.textContent = ''; Q.started.dataset.key = ''; }
    }

    // ───── মসজিদ যোগ / সম্পাদনা / মুছে ফেলা / নির্বাচন ─────
    Q.addBtn.addEventListener('click', () => {
      Q.addForm.hidden = !Q.addForm.hidden; Q.addBtn.setAttribute('aria-expanded', String(!Q.addForm.hidden));
      Q.addMsg.textContent = ''; if (!Q.addForm.hidden) Q.addIn.focus();
    });
    const doAdd = () => {
      const r = addMosque(Q.addIn.value);
      if (!r.ok) { Q.addMsg.textContent = 'মসজিদের নাম লিখুন।'; return; }
      Q.addIn.value = ''; Q.addForm.hidden = true; Q.addBtn.setAttribute('aria-expanded', 'false'); Q.addMsg.textContent = '';
      mqRender(); mqNote(r);
    };
    $(root, '#pt-mq-add-save').addEventListener('click', doAdd);
    Q.addIn.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
    $(root, '#pt-mq-add-cancel').addEventListener('click', () => { Q.addForm.hidden = true; Q.addIn.value = ''; Q.addMsg.textContent = ''; Q.addBtn.setAttribute('aria-expanded', 'false'); });

    Q.chips.addEventListener('click', e => {
      const b = e.target.closest('button[data-id]'); if (!b) return;
      const r = selectMosque(b.dataset.id); mqRender(); mqNote(r);
    });

    Q.editBtn.addEventListener('click', () => {
      const sel = selectedMosque(); if (!sel) return;
      Q.delForm.hidden = true; Q.editForm.hidden = false; Q.editIn.value = sel.name; Q.editMsg.textContent = ''; Q.editIn.focus();
    });
    const doEdit = () => {
      const sel = selectedMosque(); if (!sel) return;
      const r = renameMosque(sel.id, Q.editIn.value);
      if (!r.ok) { Q.editMsg.textContent = 'মসজিদের নাম খালি রাখা যাবে না।'; return; }
      mqRender(); mqNote(r);
    };
    $(root, '#pt-mq-edit-save').addEventListener('click', doEdit);
    Q.editIn.addEventListener('keydown', e => { if (e.key === 'Enter') doEdit(); });
    $(root, '#pt-mq-edit-cancel').addEventListener('click', () => { Q.editForm.hidden = true; Q.editMsg.textContent = ''; });

    Q.delBtn.addEventListener('click', () => {
      const sel = selectedMosque(); if (!sel) return;
      Q.editForm.hidden = true; Q.delForm.hidden = false; Q.delText.textContent = '"' + sel.name + '" মুছে ফেলবেন? এর সব জামাতের সময়ও মুছে যাবে।';
    });
    $(root, '#pt-mq-del-yes').addEventListener('click', () => {
      const sel = selectedMosque(); if (!sel) return;
      const r = removeMosque(sel.id); mqRender(); mqNote(r);
    });
    $(root, '#pt-mq-del-no').addEventListener('click', () => { Q.delForm.hidden = true; });

    // জামাতের সময় বদলালে সাথে সাথে সংরক্ষণ ও হিসাব
    Q.rows.addEventListener('change', e => {
      const inp = e.target.closest('input.pt-mq-time'); const sel = selectedMosque(); if (!inp || !sel) return;
      const r = setJamaat(sel.id, inp.dataset.key, inp.value);
      if (!r.ok) { inp.value = sel.jamaat[inp.dataset.key]; return; }
      mqUpdate(livePlan, Date.now()); mqNote(r);
    });
    Q.rows.addEventListener('click', e => {
      const b = e.target.closest('button.pt-mq-clr'); const sel = selectedMosque(); if (!b || !sel) return;
      const r = setJamaat(sel.id, b.dataset.key, ''); mqRows[b.dataset.key].inp.value = '';
      mqUpdate(livePlan, Date.now()); mqNote(r);
    });

    fillSettingsForm(); fillP4Form(); renderLocation(); renderResult(); mqRender();
    liveReady = true; liveTick();
  }

  const api = { enDate, banglaFor, hijriFor, BN_MONTHS, HIJRI_MONTHS_BN, mosques: { get: () => clone(mosqueState), selected: () => { const s = selectedMosque(); return s ? clone(s) : null; },
    add: addMosque, rename: renameMosque, remove: removeMosque, select: selectMosque, setJamaat, status: jamaatStatus,
    reload: () => { mosqueState = loadMosques(); }, KEY: MOSQUE_KEY, KEYS: JAMAAT_KEYS, zonedMs },
  windowStatus, makruhSummary, solarNoonMs, buildPlan, timelineAt, timeline, splitDuration, WAQT, compute, getState, setLocation, setSettings, resetSettings, todayYMD, ymdInTz, addDays, parseYmd,
                locateGPS, methodPreset, METHOD_KEYS, DEFAULT_SETTINGS: clone(DEFAULT_SETTINGS),
                DEFAULT_LOCATION: clone(DEFAULT_LOCATION), STORE_KEY, ENGINE_ID, _reload: () => { state = loadState(); } };
  try { initUI(); } catch (e) { console.error('prayer UI init failed:', e); }
  return api;
})(ADHAN);

})();
</script>
