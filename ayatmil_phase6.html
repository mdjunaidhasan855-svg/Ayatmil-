<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayatmil</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1208;--parchment:#f7f2e8;--surface:#ffffff;
  --gold:#b8860b;--gold-lt:#f0dc82;--gold-dim:#c9a84c;
  --green:#1e6b45;--green-lt:#d4edda;
  --orange:#c0610a;--orange-lt:#fde8d4;
  --muted:#7a6e5f;--border:#ddd4be;
  --radius:12px;
}
body{font-family:'Inter',sans-serif;background:var(--parchment);color:var(--ink);min-height:100vh;direction:ltr;
  /* horizontal scroll কখনো হবে না */
  overflow-x:hidden}

/* ── HEADER ── */
header{background:var(--ink);padding:30px 20px 24px;text-align:center;position:relative;overflow:hidden}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.logo-ar{font-family:'Amiri',serif;font-size:2.6rem;color:var(--gold-lt);direction:rtl;line-height:1.2}
.logo-en{font-size:.72rem;font-weight:500;color:var(--gold-dim);letter-spacing:.22em;text-transform:uppercase;margin-top:5px}
.loader-status{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:5px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;font-size:.72rem;color:var(--gold-dim);
  /* ছোট স্ক্রিনে wrap হবে */
  max-width:90vw;white-space:normal;text-align:center}
.loader-status .dot{width:7px;height:7px;flex-shrink:0;border-radius:50%;background:var(--gold-dim);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.loader-status.done .dot{background:#4caf50;animation:none}
.loader-status.err  .dot{background:#e53935;animation:none}

/* ── SEARCH ── */
.search-section{
  max-width:700px;
  margin:-20px auto 0;
  /* padding দিয়ে দুপাশে জায়গা, কিন্তু ছোট স্ক্রিনে কম */
  padding:0 16px;
  position:relative;z-index:10;
  /* overflow prevent */
  box-sizing:border-box;width:100%}
.search-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;box-shadow:0 6px 30px rgba(0,0,0,.12);overflow:hidden}

/* Search row: input flex হবে, button shrink হবে না */
.search-row{
  display:flex;
  align-items:stretch;  /* button ও input সমান উচ্চতা */
  min-width:0;          /* flex child overflow prevent */
}
.search-input{
  flex:1 1 0;           /* grow করবে, shrink করবে, কিন্তু min-width 0 */
  min-width:0;          /* ছোট স্ক্রিনে চাপা দিলে input ছোট হবে, button নয় */
  padding:16px 14px;
  font-family:'Amiri',serif;font-size:1.15rem;
  border:none;outline:none;background:transparent;
  color:var(--ink);direction:rtl;text-align:right}
.search-input::placeholder{color:#c0b8ac;font-size:1rem}

.search-btn{
  flex:0 0 auto;        /* button কখনো shrink হবে না */
  margin:8px;
  padding:10px 16px;
  background:var(--gold);color:#fff;
  border:none;border-radius:10px;
  font-size:.8rem;font-weight:600;letter-spacing:.06em;
  cursor:pointer;transition:background .15s,transform .1s;
  white-space:nowrap;
  /* minimum width guarantee */
  min-width:64px}
.search-btn:hover{background:#9a6e00}
.search-btn:active{transform:scale(.97)}
.search-btn:disabled{background:#ccc;cursor:not-allowed}

/* Opts row: chip-গুলো wrap হবে, সমান gap */
.opts-row{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  padding:8px 12px;
  border-top:1px solid #f0ebe0;
  background:#faf8f3}
.opt-chip{
  display:flex;align-items:center;gap:4px;
  padding:5px 9px;
  border:1.5px solid var(--border);border-radius:20px;
  font-size:.7rem;color:var(--muted);
  cursor:pointer;user-select:none;
  transition:border-color .15s,background .15s;
  white-space:nowrap;  /* chip-এর ভেতরে text wrap হবে না */
  flex-shrink:0}       /* chip নিজে shrink হবে না */
.opt-chip input{display:none}
.opt-chip.active{border-color:var(--gold);background:rgba(184,134,11,.08);color:var(--gold)}
.opt-chip .chip-dot{width:6px;height:6px;flex-shrink:0;border-radius:50%;background:var(--border);transition:background .15s}
.opt-chip.active .chip-dot{background:var(--gold)}

/* ── PROGRESS ── */
.progress-wrap{max-width:700px;margin:8px auto 0;padding:0 16px;display:none;box-sizing:border-box;width:100%}
.progress-bar{height:3px;background:#e8e0d0;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s ease;width:0%}
.progress-label{font-size:.66rem;color:var(--muted);margin-top:4px;text-align:center}

/* ── MAIN ── */
main{max-width:700px;margin:20px auto 60px;padding:0 16px;box-sizing:border-box;width:100%}

/* ── STATUS ── */
.status-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:24px;flex-wrap:wrap;gap:6px}
.result-meta{font-size:.75rem;color:var(--muted)}
.result-meta strong{color:var(--ink)}
.page-badge{font-size:.66rem;font-weight:700;letter-spacing:.1em;padding:2px 10px;background:var(--ink);color:var(--gold-lt);border-radius:20px}

/* ── STATS ── */
.stats-strip{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stat-pill{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.04em}
.stat-pill.exact{background:var(--green-lt);color:var(--green)}
.stat-pill.partial{background:var(--orange-lt);color:var(--orange)}
.stat-pill .count{font-size:.8rem}

/* ── RESULT CARDS ── */
.result-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .18s}
.result-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.09)}
.result-card.exact  {border-color:#1e6b45;background:#f0faf4}
.result-card.partial{border-color:#b8860b;background:#fdfbf0}

.card-head{display:flex;align-items:flex-start;justify-content:space-between;padding:9px 12px;gap:8px;flex-wrap:wrap}
.result-card.exact   .card-head{border-bottom:1px solid rgba(30,107,69,.15)}
.result-card.partial .card-head{border-bottom:1px solid rgba(184,134,11,.15)}

.surah-badge-num{width:28px;height:28px;flex-shrink:0;border-radius:50%;background:var(--ink);color:var(--gold-lt);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700}
.surah-ar{font-family:'Amiri',serif;font-size:.95rem;color:var(--ink);direction:rtl}
.surah-en{font-size:.65rem;color:var(--muted);font-weight:500}
.meta-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0}
.ayah-ref{font-size:.66rem;color:var(--muted);background:rgba(0,0,0,.05);padding:2px 8px;border-radius:12px;white-space:nowrap}
.match-tag{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;font-size:.64rem;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.match-tag.exact  {background:var(--green);color:#fff}
.match-tag.partial{background:var(--gold);color:#fff}
.match-tag::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}

.card-body{padding:14px 14px}
.arabic-line{font-family:'Amiri',serif;font-size:1.55rem;line-height:2.1;direction:rtl;text-align:right;color:var(--ink);
  /* word break আরবিতে */
  overflow-wrap:break-word;word-break:break-word}

/* ── HIGHLIGHT ── */
.arabic-line mark{
  background:#fde68a;
  color:var(--ink);
  border-radius:3px;
  padding:0 3px;
  font-style:normal;
}
.arabic-line mark.exact-hl{
  background:#86efac;
  color:#14532d;
}
.translation{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:.8rem;color:var(--muted);line-height:1.65;font-style:italic;direction:ltr;text-align:left}

/* ── পারা ও পৃষ্ঠা BADGES ── */
.juz-page-strip{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.06);flex-wrap:wrap}
.jp-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:600;letter-spacing:.04em;border:1.5px solid transparent}
.jp-badge.juz {background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
.jp-badge.page{background:#fdf4ff;color:#7e22ce;border-color:#e9d5ff}
.jp-badge .jp-label{opacity:.65;font-weight:500}
.jp-badge .jp-val{font-weight:700}

/* ── CARD FOOTER ── */
.card-foot{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:rgba(0,0,0,.025);border-top:1px solid rgba(0,0,0,.05);gap:8px;flex-wrap:wrap}
.meta-tags{display:flex;gap:5px;flex-wrap:wrap}
.mtag{font-size:.64rem;padding:2px 7px;background:rgba(0,0,0,.05);border-radius:10px;color:var(--muted);white-space:nowrap}
.mtag.juz {background:#eef2ff;color:#3730a3}
.mtag.page{background:#fdf4ff;color:#7e22ce}
.sim-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sim-label{font-size:.64rem;color:var(--muted);white-space:nowrap}
.sim-bar{width:60px;height:4px;background:rgba(0,0,0,.1);border-radius:2px;overflow:hidden}
.sim-fill{height:100%;border-radius:2px;background:var(--gold)}
.result-card.exact .sim-fill{background:var(--green)}

/* ── EMPTY / STATE ── */
.state-box{text-align:center;padding:50px 16px;color:var(--muted)}
.state-icon{font-family:'Amiri',serif;font-size:3rem;color:var(--gold-lt);margin-bottom:14px;direction:rtl}
.state-box h3{font-size:1rem;font-weight:600;color:var(--ink);margin-bottom:6px}
.state-box p{font-size:.82rem;line-height:1.7}

/* ── PAGINATION ── */
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:20px;flex-wrap:wrap;padding:0 4px}
.pager button{padding:5px 12px;border:1.5px solid var(--border);background:var(--surface);border-radius:8px;font-size:.75rem;cursor:pointer;color:var(--ink);transition:all .15s;white-space:nowrap}
.pager button:hover{border-color:var(--gold)}
.pager button.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.pager button:disabled{opacity:.35;cursor:default}

/* ── FOOTER ── */
.site-footer{text-align:center;padding:18px 20px;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border);margin-top:20px;letter-spacing:.04em}
.site-footer strong{color:var(--gold);font-weight:600}

/* ══════════════════════════════════════════════
   RESPONSIVE BREAKPOINTS
   ══════════════════════════════════════════════ */

/* 480px এবং নিচে */
@media (max-width:480px) {
  .logo-ar{font-size:2.2rem}
  .search-section{padding:0 12px}
  .progress-wrap{padding:0 12px}
  main{padding:0 12px}
  .search-input{font-size:1.05rem;padding:14px 12px}
  .search-btn{padding:10px 14px;font-size:.76rem}
  .arabic-line{font-size:1.4rem}
}

/* 390px এবং নিচে */
@media (max-width:390px) {
  .logo-ar{font-size:1.9rem}
  .logo-en{font-size:.65rem;letter-spacing:.14em}
  .search-section{padding:0 10px}
  .progress-wrap{padding:0 10px}
  main{padding:0 10px}
  .search-input{font-size:1rem;padding:13px 10px}
  .search-btn{padding:9px 12px;font-size:.74rem;min-width:56px}
  .opts-row{padding:7px 10px;gap:5px}
  .opt-chip{padding:4px 8px;font-size:.68rem}
  .arabic-line{font-size:1.3rem;line-height:2}
  .card-body{padding:12px 12px}
  .card-head{padding:8px 10px}
  .card-foot{padding:6px 10px}
}

/* 360px এবং নিচে */
@media (max-width:360px) {
  .logo-ar{font-size:1.7rem}
  .search-section{padding:0 8px}
  .progress-wrap{padding:0 8px}
  main{padding:0 8px}
  .search-input{font-size:.95rem;padding:12px 10px}
  .search-btn{padding:9px 11px;font-size:.72rem;min-width:52px;letter-spacing:.02em}
  .opts-row{padding:6px 8px;gap:4px}
  .opt-chip{padding:4px 7px;font-size:.66rem}
  .arabic-line{font-size:1.2rem}
  .surah-en{display:none} /* 360px-এ ইংরেজি নাম বাদ — আরবি নাম থাকবে */
}

/* 320px — সবচেয়ে ছোট */
@media (max-width:320px) {
  .logo-ar{font-size:1.5rem}
  .loader-status{font-size:.65rem;padding:4px 10px}
  .search-section{padding:0 6px}
  .progress-wrap{padding:0 6px}
  main{padding:0 6px}
  .search-input{font-size:.9rem;padding:11px 8px}
  .search-btn{padding:8px 10px;font-size:.7rem;min-width:48px}
  .opts-row{padding:6px 6px;gap:4px}
  .opt-chip{padding:3px 6px;font-size:.64rem}
  .arabic-line{font-size:1.1rem;line-height:1.9}
  .card-body{padding:10px 10px}
  .card-head{padding:7px 8px}
  .card-foot{padding:5px 8px}
  .mtag{font-size:.6rem;padding:2px 5px}
  .jp-badge{padding:2px 7px;font-size:.62rem}
  .sim-bar{width:44px}
}

/* ═══ Phase 1: নেভিগেশন ও ভিউ-কন্টেইনার ═══ */
header{padding-bottom:40px}               /* ট্যাব বারের জন্য জায়গা (সার্চ কার্ড -20px ওভারল্যাপ করে) */
.app-tabs{display:flex;justify-content:center;gap:6px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.app-tab{font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;
  padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);color:var(--gold-dim);transition:all .15s}
.app-tab:hover{border-color:var(--gold-dim)}
.app-tab:focus-visible{outline:2px solid var(--gold-lt);outline-offset:2px}
.app-tab[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.app-view[hidden]{display:none}
body.view-prayer .loader-status{display:none}   /* কুরআন ডেটার স্ট্যাটাস শুধু সার্চ ট্যাবে */
.pt-view{max-width:700px;margin:28px auto 60px;padding:0 16px;box-sizing:border-box;width:100%}
@media(max-width:480px){.app-tab{padding:7px 14px;font-size:.78rem}.pt-view{padding:0 12px}}
@media(max-width:360px){.pt-view{padding:0 8px}}

/* ═══ Phase 2: নামাজের সময়সূচি — ইঞ্জিন, লোকেশন, সেটিংস ═══ */
.pt-banner{background:#fff;border:1.5px solid var(--border);border-left:4px solid var(--gold);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:.78rem;line-height:1.65;color:var(--muted)}
.pt-banner strong{display:block;color:var(--ink);font-size:.86rem;margin-bottom:3px}
.pt-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.pt-card h3{font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:12px}
.pt-sub{font-size:.76rem;font-weight:600;color:var(--muted);margin:14px 0 8px}
.pt-loc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pt-loc-name{font-size:1.05rem;font-weight:700}
.pt-badge{font-size:.62rem;font-weight:700;padding:2px 9px;border-radius:20px;background:#eee;color:var(--muted)}
.pt-badge-gps{background:var(--green-lt);color:var(--green)}
.pt-badge-manual{background:#eef2ff;color:#3730a3}
.pt-badge-default{background:var(--orange-lt);color:var(--orange)}
.pt-loc-coords{font-size:.74rem;color:var(--muted);margin-top:4px;word-break:break-word}
.pt-warn{font-size:.74rem;line-height:1.6;color:var(--orange);background:var(--orange-lt);border-radius:8px;padding:8px 10px;margin-top:8px}
.pt-btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pt-btn{font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;padding:9px 14px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--ink);transition:all .15s}
.pt-btn:hover{border-color:var(--gold)}
.pt-btn:disabled{opacity:.55;cursor:not-allowed}
.pt-btn-primary{background:var(--gold);border-color:var(--gold);color:#fff}
.pt-btn-primary:hover{background:#9a6e00;border-color:#9a6e00}
.pt-btn-sm{padding:7px 12px}
.pt-btn:focus-visible,.pt-input:focus-visible,.pt-chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pt-msg{font-size:.76rem;line-height:1.6;margin-top:10px;min-height:1px}
.pt-msg-ok{color:var(--green)} .pt-msg-err{color:#c62828} .pt-msg-warn{color:var(--orange)}
.pt-manual{margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,0,0,.07)}
.pt-manual[hidden]{display:none}
.pt-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pt-chip{font-family:inherit;font-size:.74rem;cursor:pointer;padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--ink)}
.pt-chip:hover{border-color:var(--gold);color:var(--gold)}
.pt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pt-grid-adj{grid-template-columns:repeat(3,minmax(0,1fr))}
.pt-wide{grid-column:1/-1}
.pt-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.pt-field>span{font-size:.7rem;font-weight:600;color:var(--muted);line-height:1.4}
.pt-input{width:100%;min-width:0;font-family:inherit;font-size:.85rem;padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;background:#fff;color:var(--ink)}
.pt-hint{font-size:.72rem;line-height:1.6;color:var(--muted);margin-top:10px}
.pt-datebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pt-date{flex:1 1 140px;width:auto}
.pt-datelabel{font-size:.82rem;font-weight:600;margin:12px 0 6px}
.pt-table{width:100%;border-collapse:collapse}
.pt-table th,.pt-table td{padding:11px 4px;border-bottom:1px solid rgba(0,0,0,.07);text-align:left;vertical-align:middle}
.pt-table tr:last-child th,.pt-table tr:last-child td{border-bottom:none}
.pt-pn{display:block;font-size:.92rem;font-weight:600}
.pt-pe{display:block;font-size:.66rem;color:var(--muted);letter-spacing:.04em}
.pt-time{text-align:right!important;font-size:1.05rem;font-weight:700;color:var(--green);white-space:nowrap}
.pt-meta{font-size:.7rem;line-height:1.7;color:var(--muted);margin-top:12px;word-break:break-word}
.pt-credit{font-size:.68rem;color:var(--muted);text-align:center;line-height:1.6;margin-top:4px}
@media(max-width:480px){.pt-grid{grid-template-columns:1fr}.pt-grid-adj{grid-template-columns:repeat(2,minmax(0,1fr))}.pt-card{padding:14px 12px}}

/* ═══ Phase 3: এখনকার ওয়াক্ত, কাউন্টডাউন, প্রগ্রেস বার, দৈনিক সূচি ═══ */
.pt-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pt-now{border-color:var(--gold);background:linear-gradient(180deg,#fffdf5 0%,#fff 70%);text-align:center;padding:16px 16px 18px}
.pt-now-head{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);text-align:left}
.pt-now-state{display:inline-block;margin-top:14px;font-size:.7rem;font-weight:700;padding:3px 12px;border-radius:20px;background:#eee;color:var(--muted)}
.pt-st-waqt{background:var(--green-lt);color:var(--green)}
.pt-st-gap{background:var(--orange-lt);color:var(--orange)}

// ৩০ পারার শুরুর [সূরা, আয়াত] — বাংলাদেশে প্রচলিত ইন্দো-পাক (হাফিজি) পারা বিভাজন।
// ⚠ API-র (মাদানি) juz নম্বর ব্যবহার করা হয় না। এই তালিকা এমদাদিয়া পৃষ্ঠা-টেবিলের
//   EMDADIA_PARA_STARTS-এর সাথেও মিলিয়ে যাচাই করা (পারা ১–২৯)।
const INDOPAK_JUZ_STARTS = [
  [1,1],[2,142],[2,253],[3,92],[4,24],[4,148],[5,83],[6,111],[7,88],[8,41],
  [9,94],[11,6],[12,53],[15,2],[17,1],[18,75],[21,1],[23,1],[25,21],[27,60],
  [29,45],[33,31],[36,22],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]
];

function getIndoPakJuz(surahNo, ayahNo) {
  let juz = 1;
  for (let i = 0; i < INDOPAK_JUZ_STARTS.length; i++) {

    if (surahNo > s || (surahNo === s && ayahNo >= a)) juz = i + 1;

  return juz;

  403,423,443,463,483,503,523,543,563,587

// global ayah number → Emdadia book page (২–৬১১)
function getEmdadiaPage(globalNum) {
  let page = 2;
  for (let i = 0; i < EMDADIA_PAGE_STARTS.length; i++) {
    if (globalNum >= EMDADIA_PAGE_STARTS[i]) page = i + 2;
    else break;
  }
  return page;
}

// book page + juz → page number within that juz
function getPageInJuz(bookPage, juz) {
  if (juz < 1 || juz > 30) return null;
  return bookPage - EMDADIA_PARA_STARTS[juz - 1] + 1;
}

// API-তে juz/page না থাকলে lookup দিয়ে বের করা
// page = Emdadia book page, pageInJuz = পারার ভেতরে পৃষ্ঠা নম্বর
function enrichWithJuzPage(ayah) {
  const g        = getGlobalAyahNum(ayah.surah_no, ayah.ayah_no);
  const juz      = getIndoPakJuz(ayah.surah_no, ayah.ayah_no);
  const bookPage = getEmdadiaPage(getPageTableNum(ayah.surah_no, ayah.ayah_no));
  const pageInJuz = getPageInJuz(bookPage, juz);
  return { ...ayah, juz, bookPage, pageInJuz };
}

// ── বিসমিল্লাহ প্রিফিক্স সরানো ──
// কিছু API (যেমন alquran.cloud) সূরার প্রথম আয়াতের শুরুতে বিসমিল্লাহ জুড়ে দেয়।
// সূরা ১ (ফাতিহা) ও ৯ (তাওবা) বাদে প্রথম আয়াতের শুরুতে চারটি শব্দ মিললে সেগুলো সরানো হয়।
const BISMILLAH_NORM = ['بسم','الله','الرحمن','الرحيم'];
function stripBismillah(text, surahNo, ayahNo) {
  if (!text || ayahNo !== 1 || surahNo === 1 || surahNo === 9) return text;
  const tokens = text.trim().split(/\s+/);
  if (tokens.length <= 4) return text;
  for (let i = 0; i < 4; i++) {
    if (normalize(tokens[i]) !== BISMILLAH_NORM[i]) return text;
  }
  return tokens.slice(4).join(' ');
}

// ── Source 1: alquran.cloud ──
function parseAlquranCloud(surahs) {
  QURAN = [];
  surahs.forEach(s => {
    s.ayahs.forEach(a => {
      const g       = getGlobalAyahNum(s.number, a.numberInSurah);
      const juz     = getIndoPakJuz(s.number, a.numberInSurah);
      const bookPage  = getEmdadiaPage(getPageTableNum(s.number, a.numberInSurah));
      const pageInJuz = getPageInJuz(bookPage, juz);
      QURAN.push({ surah_no: s.number, ayah_no: a.numberInSurah,
        ayah_ar: stripBismillah(a.text, s.number, a.numberInSurah), ayah_en: '', juz, bookPage, pageInJuz });
    });
  });
}

// ── Source 2: quran.com v4 ──
async function loadFromQuranCom() {
  QURAN = [];
  for (let s = 1; s <= 114; s++) {
    setProgress(10 + Math.round((s/114)*30), `quran.com: সূরা ${s}/114…`);
    const r = await fetchWithTimeout(
      `https://api.quran.com/api/v4/verses/by_chapter/${s}?per_page=300&fields=text_uthmani`, 10000);
    const j = await r.json();
    (j.verses || []).forEach(v => {
      QURAN.push(enrichWithJuzPage({
        surah_no: s, ayah_no: v.verse_number,
        ayah_ar: stripBismillah(v.text_uthmani || '', s, v.verse_number), ayah_en: ''
      }));
    });
  }
}

// ── Source 3: jsdelivr ──
async function loadFromJsdelivr() {
  QURAN = [];
  for (let s = 1; s <= 114; s++) {
    setProgress(20 + Math.round((s/114)*60), `jsdelivr: সূরা ${s}/114…`);
    const r = await fetchWithTimeout(

      }));
    });
  }
}

// ── Utility ──
function fetchWithTimeout(url, ms = 10000) {
  return Promise.race([
    fetch(url),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
  ]);
}

function doneLoading(mode = 'ok') {
  showProgress(false);
  const count = QURAN.length;
  const isOk  = mode === 'ok' && count > 5000;
  setStatus(
    isOk ? 'done' : 'err',
    isOk ? `✓ ${count.toLocaleString()} আয়াত লোড সম্পন্ন`
         : `⚠ ${count} আয়াত লোড — পুনরায় পৃষ্ঠা রিফ্রেশ করুন`
  );
  document.getElementById('search-btn').disabled = false;
  document.getElementById('search-input').focus();
}

function setStatus(type, text) {
  const el = document.getElementById('loader-status');
  el.className = 'loader-status ' + (type === 'done' ? 'done' : type === 'err' ? 'err' : '');
  document.getElementById('loader-text').textContent = text;
}
function showProgress(show) {
  document.getElementById('progress-wrap').style.display = show ? 'block' : 'none';
}
function setProgress(pct, label) {
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = label;
}

// ═══════════════════════════════════════════════════════
//  ARABIC NORMALIZATION
// ═══════════════════════════════════════════════════════
function normalize(t) {
  if (!t) return '';
  return t
    .replace(/[\u064B-\u065F\u0610-\u061A\u06D6-\u06DC\u06DF-\u06E4\u06E5\u06E6\u06E7\u06E8\u06EA-\u06ED\u0670\u0653\u0640]/g, '')
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ؤ/g, 'و')
    .replace(/[ئى]/g, 'ي')
    .replace(/ء/g, '')
    .replace(/\s+/g, ' ').trim();
}

// ═══════════════════════════════════════════════════════
//  SIMILARITY
// ═══════════════════════════════════════════════════════
function similarity(text, query) {
  if (text === query) return 100;
  const qt = query.split(/\s+/).filter(Boolean);
  if (!qt.length) return 0;
  let hits = 0;
  qt.forEach(w => { if (text.includes(w)) hits++; });
  return Math.round((hits / qt.length) * 100);
}

// ═══════════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════════
function doSearch() {
  const raw = document.getElementById('search-input').value.trim();
  if (!raw) return;
  if (!QURAN.length) { alert('ডেটা এখনো লোড হয়নি। একটু অপেক্ষা করুন।'); return; }

  const optExact   = document.getElementById('opt-exact').checked;
  const optPartial = document.getElementById('opt-partial').checked;
  const optDia     = document.getElementById('opt-dia').checked;

  const query  = optDia ? normalize(raw) : raw;
  currentQuery = raw;

  const results = [];

  for (const a of QURAN) {
    const text = optDia ? normalize(a.ayah_ar) : a.ayah_ar;
    if (!text) continue;

    const words         = text.split(/\s+/);
    const isExactWord   = words.some(w => w === query);
    const isPhraseMatch = text.includes(query);

    if ((isExactWord || isPhraseMatch) && optExact) {
      results.push({ ...a, matchType: 'exact', similarity: 100 });
    } else if (optPartial) {
      const queryWords = query.split(/\s+/).filter(w => w.length > 1);
      const anyMatch   = queryWords.some(w => text.includes(w));
      if (anyMatch) {
        const sim = similarity(text, query);
        if (sim >= 30) results.push({ ...a, matchType: 'partial', similarity: sim });
      }
    }
  }

  results.sort((a, b) => {
    if (a.matchType !== b.matchType) return a.matchType === 'exact' ? -1 : 1;
    return b.similarity - a.similarity;
  });

  currentResults = results;
  currentPage    = 1;
  render();
}

// ═══════════════════════════════════════════════════════
//  HIGHLIGHT
//  text    = original আরবি (হরকতসহ)
//  query   = সার্চ শব্দ (opt_dia=true হলে normalize হয়ে আসে)
//  isExact = true → সবুজ (exact-hl), false → হলুদ
//  optDia  = true → হরকত উপেক্ষা চালু
//
//  পদ্ধতি:
//  ১. text-কে শব্দ ও space-এ ভাগ করি (split by whitespace, keep delimiters)
//  ২. প্রতিটি শব্দ normalize করে query-র সাথে মেলাই
//  ৩. match হলে original শব্দটি <mark> দিয়ে wrap করি
//  ৪. শুধু সম্পূর্ণ শব্দ বা শব্দের শুরু/শেষ match করি — partial substring নয়
// ═══════════════════════════════════════════════════════
function highlight(text, query, isExact, optDia) {
  if (!query || !text) return esc(text);

  const cls = isExact ? 'exact-hl' : '';

  // query-কে শব্দে ভাগ করি, দীর্ঘ শব্দ আগে (greedy match)
  const queryParts = query.split(/\s+/).filter(Boolean)
                          .sort((a, b) => b.length - a.length);
  if (!queryParts.length) return esc(text);

  try {
    // text-কে [শব্দ, space, শব্দ, space, ...] আকারে ভাগ করি
    const tokens = text.split(/(\s+)/);

    const result = tokens.map(token => {
      // space/whitespace → সরাসরি return
      if (/^\s+$/.test(token)) return esc(token);

      // এই token-টি match হয় কিনা দেখি
      const normToken = optDia ? normalize(token) : token;

      const matched = queryParts.some(q => {
        // exact word match অথবা token শুরুতে/শেষে query আছে
        // (আরবিতে prefix/suffix diacritic যুক্ত হওয়ায় startsWith/endsWith দরকার)
        return normToken === q
            || normToken.startsWith(q)
            || normToken.endsWith(q);
      });

      return matched
        ? `<mark class="${cls}">${esc(token)}</mark>`
        : esc(token);
    });

    return result.join('');
  } catch {
    return esc(text);
  }
}

  const exactN   = currentResults.filter(r => r.matchType === 'exact').length;
  const partialN = currentResults.filter(r => r.matchType === 'partial').length;
  const pages    = Math.ceil(currentResults.length / PER_PAGE);
  const slice    = currentResults.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);

  statusEl.innerHTML = `
    <span class="result-meta">মোট <strong>${currentResults.length}</strong> ফলাফল</span>
    <span class="page-badge">পৃষ্ঠা ${currentPage}/${pages}</span>`;

  statsEl.innerHTML = `
    ${exactN   ? `<span class="stat-pill exact"><span class="count">${exactN}</span> Exact Match</span>`   : ''}
    ${partialN ? `<span class="stat-pill partial"><span class="count">${partialN}</span> Partial Match</span>` : ''}`;

  container.innerHTML = slice.map(r => {
    const [arName, enName] = SURAH[r.surah_no] || ['', ''];
    const arText = highlight(r.ayah_ar, dispQuery, r.matchType === 'exact', optDia);
    const trans  = (showTrans && r.ayah_en)
      ? `<div class="translation">${esc(r.ayah_en)}</div>` : '';

    const juzVal     = r.juz       != null ? r.juz       : '—';
    const pageInJuz  = r.pageInJuz != null ? r.pageInJuz : '—';

    return `
    <div class="result-card ${r.matchType}">
      <div class="card-head">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div class="surah-badge-num">${r.surah_no}</div>
          <span class="surah-ar">${arName}</span>
          <span class="surah-en">${enName}</span>
        </div>
        <div class="meta-right">
          <span class="ayah-ref">আয়াত ${r.ayah_no}</span>
          <span class="match-tag ${r.matchType}">${r.matchType === 'exact' ? 'EXACT' : 'PARTIAL'}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="arabic-line">${arText}</div>
        ${trans}
        <div class="juz-page-strip">
          <span class="jp-badge juz">
            <span class="jp-label">পারা</span>
            <span class="jp-val">${juzVal}</span>
          </span>
          <span class="jp-badge page">
            <span class="jp-label">পারার পৃষ্ঠা</span>
            <span class="jp-val">${pageInJuz}</span>
          </span>
        </div>
      </div>
      <div class="card-foot">
        <div class="meta-tags">
          <span class="mtag">📖 সূরা ${r.surah_no}</span>
          <span class="mtag">🔢 আয়াত ${r.ayah_no}</span>
          <span class="mtag juz">পারা ${juzVal}</span>
          <span class="mtag page">পৃষ্ঠা ${pageInJuz}</span>
        </div>
        <div class="sim-wrap">
          <span class="sim-label">মিল ${r.similarity}%</span>
          <div class="sim-bar">
            <div class="sim-fill" style="width:${r.similarity}%"></div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  renderPager(pages);
}

function renderPager(pages) {
  const el = document.getElementById('pager');
  if (pages <= 1) { el.innerHTML = ''; return; }
  let h = `<button ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">← আগে</button>`;
  for (let p = 1; p <= pages; p++) {
    if (p===1 || p===pages || Math.abs(p-currentPage)<=1)
      h += `<button class="${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
    else if (Math.abs(p-currentPage)===2)
      h += `<button disabled>…</button>`;
  }
  h += `<button ${currentPage===pages?'disabled':''} onclick="goPage(${currentPage+1})">পরে →</button>`;
  el.innerHTML = h;
}

function goPage(p) {
  currentPage = p;
  render();
  document.querySelector('.search-section').scrollIntoView({ behavior: 'smooth' });
}

(function () {
  const views = { search: document.getElementById('view-search'),
                  prayer: document.getElementById('view-prayer') };
  const tabs  = { search: document.getElementById('tab-search'),
                  prayer: document.getElementById('tab-prayer') };

  function show(name) {
    if (!views[name]) name = 'search';
    Object.keys(views).forEach(k => {
      views[k].hidden = (k !== name);
      tabs[k].setAttribute('aria-selected', String(k === name));
      tabs[k].tabIndex = (k === name) ? 0 : -1;
    });
    document.body.classList.toggle('view-prayer', name === 'prayer');
  }
  function fromHash() { show(location.hash === '#prayer' ? 'prayer' : 'search'); }

  Object.keys(tabs).forEach(k => tabs[k].addEventListener('click', () => {
    if (k === 'prayer') { location.hash = 'prayer'; }
    else { history.pushState(null, '', location.pathname + location.search); fromHash(); }
  }));
  document.getElementById('app-tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const next = document.body.classList.contains('view-prayer') ? 'search' : 'prayer';
    tabs[next].focus(); tabs[next].click();
  });
  window.addEventListener('hashchange', fromHash);
  window.addEventListener('popstate', fromHash);
  fromHash();
})();

                    sunset: pt.sunset, maghrib: pt.maghrib, isha: pt.isha };
    const valid = Object.keys(times).every(k => times[k] instanceof Date && isFinite(times[k].getTime()));
    return {
      ymd: { ...ymd }, dateKey: ymdKey(ymd), tz: resolveTz(S), times, valid,
      location: L, settings: S,
      params: { method: S.method, fajrAngle: params.fajrAngle, ishaAngle: params.ishaAngle,
                ishaInterval: params.ishaInterval, maghribAngle: params.maghribAngle || 0,
                madhab: params.madhab, highLatitudeRule: params.highLatitudeRule,
                methodAdjustments: { ...params.methodAdjustments }, adjustments: { ...params.adjustments },
                rounding: params.rounding },
      engine: ENGINE_ID
    };
  }
  function todayYMD(settings) { return ymdInTz(new Date(), resolveTz(sanitizeSettings(settings || state.settings))); }



  // ═══════════ Phase 4: সৌর মধ্যাহ্ন (T0), নফল ও মাকরুহ উইন্ডো ═══════════
  // T0 = প্রকৃত সৌর মধ্যাহ্ন (সূর্য মধ্যগগনে)। adhan-এর "Other" পদ্ধতিতে কোনো পদ্ধতি-সমন্বয় (যেমন দুবাইয়ের +৩)
  // থাকে না, তাই dhuhr = শুধু সৌর transit (নিকটতম মিনিটে রাউন্ড)। ব্যবহারকারীর যোহর-সমন্বয় এতে প্রযোজ্য নয়।
  function solarNoonMs(ymd, loc) {
    const L = sanitizeLocation(loc || state.location);
    const coords = new Adhan.Coordinates(L.lat, L.lng);
    return new Adhan.PrayerTimes(coords, new Date(ymd.y, ymd.m - 1, ymd.d, 12, 0, 0), Adhan.CalculationMethod.Other()).dhuhr.getTime();
  }
  const MIN = 60000;
  const roundMin = ms => Math.round(ms / MIN) * MIN;

  // একটি দিনের সব নফল ও মাকরুহ উইন্ডো। সব সীমা Phase 3-এর একই টাইমস্ট্যাম্প থেকে আসে।
  //   মাকরুহ সূর্যোদয় : সূর্যোদয় (= ফজরের শেষ)        → সূর্যোদয় + N মিনিট
  //   ইশরাক           : সূর্যোদয় মাকরুহ শেষ            → চাশতের শুরু
  //   চাশত            : দিনের ¼ পার (বা N মিনিট)         → ইস্তিওয়া মাকরুহ শুরু
  //   মাকরুহ ইস্তিওয়া : T0 − B মিনিট                    → যোহরের শুরু (≥ T0)
  //   মাকরুহ সূর্যাস্ত : সূর্যাস্ত − N মিনিট              → সূর্যাস্ত (= আসরের শেষ)
  //   আওয়াবিন         : মাগরিব শুরু                    → ইশা শুরু (বা মাগরিব + N)
  //   তাহাজ্জুদ        : ইশা শুরু                       → পরদিন ফজর শুরু; শেষ ১/৩ আলাদা
  function buildDayWindows(ctx, nxt, S, warn) {
    const t = ctx.c.times, dk = ctx.c.dateKey, mk = S.makruh, nf = S.nafl;
    const sunrise = t.sunrise.getTime(), sunset = t.sunset.getTime(), fajr = t.fajr.getTime(), asr = t.asr.getTime();
    const maghrib = t.maghrib.getTime(), isha = t.isha.getTime();
    const dhuhrStart = Math.max(t.dhuhr.getTime(), ctx.t0);
    const nextFajr = nxt.c.times.fajr.getTime(), nextSunrise = nxt.c.times.sunrise.getTime();
    const W = [];
    const add = (id, group, s, e) => { if (e > s) W.push({ id, group, dayKey: dk, start: s, end: e }); else warn.push('empty:' + id); };

    const istiwaStart = ctx.t0 - mk.istiwaBeforeMin * MIN, istiwaEnd = dhuhrStart;
    let srEnd = sunrise + mk.sunriseMin * MIN;
    if (srEnd > istiwaStart) { srEnd = istiwaStart; warn.push('clamp:mk_sunrise'); }
    let ssStart = sunset - mk.sunsetMin * MIN;
    if (ssStart < asr) { ssStart = asr; warn.push('clamp:mk_sunset'); }
    add('mk_sunrise', 'makruh', sunrise, srEnd);
    add('mk_istiwa',  'makruh', istiwaStart, istiwaEnd);
    add('mk_sunset',  'makruh', ssStart, sunset);

    let chashtStart;
    if (nf.chashtMode === 'minutes') chashtStart = sunrise + nf.chashtMinutes * MIN;
    else {
      const ds = nf.dayDef === 'fajrMaghrib' ? fajr : sunrise, de = nf.dayDef === 'fajrMaghrib' ? maghrib : sunset;
      chashtStart = roundMin(ds + (de - ds) / 4);
    }
    const raw = chashtStart;
    chashtStart = clamp(chashtStart, srEnd, istiwaStart);
    if (chashtStart !== raw) warn.push('clamp:chasht');
    if (nf.duhaMode === 'combined') add('duha', 'nafl', srEnd, istiwaStart);
    else { add('ishraq', 'nafl', srEnd, chashtStart); add('chasht', 'nafl', chashtStart, istiwaStart); }

    add('awwabin', 'nafl', maghrib, nf.awwabinEnd === 'minutes' ? Math.min(isha, maghrib + nf.awwabinMinutes * MIN) : isha);

    add('tahajjud', 'nafl', isha, nextFajr);
    const nS = nf.nightDef === 'sunsetSunrise' ? sunset : maghrib;
    const nE = nf.nightDef === 'sunsetSunrise' ? nextSunrise : nextFajr;
    const l3 = Math.max(roundMin(nS + (nE - nS) * 2 / 3), isha);
    if (l3 < nextFajr) add('lastthird', 'nafl', l3, nextFajr);
    return W;
  }

  // নির্দিষ্ট id-র উইন্ডোর অবস্থা: চলমান / পরবর্তী / আগের
  function windowStatus(plan, id, nowMs) {
    let cur = null, next = null, prev = null;
    for (const w of (plan.windows || [])) {
      if (w.id !== id) continue;
      if (nowMs >= w.start && nowMs < w.end) cur = w;
      else if (w.start > nowMs) { if (!next || w.start < next.start) next = w; }
      else if (!prev || w.end > prev.end) prev = w;
    }
    return { cur, next, prev };
  }
  const MAKRUH_IDS = ['mk_sunrise', 'mk_istiwa', 'mk_sunset'];
  function makruhSummary(plan, nowMs) {
    let cur = null, next = null;
    for (const w of (plan.windows || [])) {
      if (w.group !== 'makruh') continue;
      if (nowMs >= w.start && nowMs < w.end) cur = w;
      else if (w.start > nowMs && (!next || w.start < next.start)) next = w;
    }
    return { cur, next };
  }

  // ═══════════ Phase 3: ফরজ ওয়াক্তের সময়রেখা ═══════════
  // সংজ্ঞা (সবই Phase 2 ইঞ্জিনের সময় থেকে; কোনো হার্ডকোড সময় নেই):
  //   ফজর    : ফজর শুরু        → সূর্যোদয়
  //   যোহর   : যোহর শুরু        → আসর শুরু (আসরের হিসাব সেটিংস অনুযায়ী; ডিফল্ট হানাফি)
  //   আসর    : আসর শুরু        → সূর্যাস্ত
  //   মাগরিব : মাগরিব শুরু      → ইশা শুরু
  //   ইশা    : ইশা শুরু        → পরদিনের ফজর শুরু
  // সূর্যোদয় থেকে যোহর শুরু পর্যন্ত কোনো ফরজ ওয়াক্ত নেই ("gap")। মিনিট-সমন্বয়ের কারণে
  // অন্য জায়গায় (যেমন সূর্যাস্ত → মাগরিব) ফাঁক বা ওভারল্যাপ হলেও একইভাবে সামলানো হয়।
  const WAQT = [
    { key: 'fajr',    bn: 'ফজর',    en: 'Fajr',    gen: 'ফজরের' },
    { key: 'dhuhr',   bn: 'যোহর',   en: 'Dhuhr',   gen: 'যোহরের' },
    { key: 'asr',     bn: 'আসর',    en: 'Asr',     gen: 'আসরের' },
    { key: 'maghrib', bn: 'মাগরিব', en: 'Maghrib', gen: 'মাগরিবের' },
    { key: 'isha',    bn: 'ইশা',    en: 'Isha',    gen: 'ইশার' }
  ];
  const WAQT_BY_KEY = {}; WAQT.forEach(w => { WAQT_BY_KEY[w.key] = w; });

  // ymd = আজকের তারিখ (নির্বাচিত সময় অঞ্চলে)। গতকাল ইশা আজ ভোরের ফজর পর্যন্ত চলে, তাই d-1 থেকে d+1 পর্যন্ত বানানো হয়।
  function buildPlan(ymd, loc, settings) {
    const L = sanitizeLocation(loc || state.location);
    const S = sanitizeSettings(settings || state.settings);
    const days = [-1, 0, 1, 2].map(i => compute(addDays(ymd, i), L, S));
    const t0s = [-1, 0, 1, 2].map(i => solarNoonMs(addDays(ymd, i), L));
    const warnings = [];
    let periods = [];
    for (let i = 0; i < 3; i++) {
      const t = days[i].times, nextFajr = days[i + 1].times.fajr;
      // যোহর কখনো প্রকৃত সৌর মধ্যাহ্ন (T0)-র আগে শুরু হয় না: ঋণাত্মক সমন্বয় হলেও ইস্তিওয়ার মাকরুহ সময়ের সাথে ওভারল্যাপ হবে না
      const dhuhrStart = Math.max(t.dhuhr.getTime(), t0s[i]);
      if (dhuhrStart !== t.dhuhr.getTime() && i === 1) warnings.push('clamp:dhuhr');
      [['fajr', t.fajr, t.sunrise], ['dhuhr', new Date(dhuhrStart), t.asr], ['asr', t.asr, t.sunset],
       ['maghrib', t.maghrib, t.isha], ['isha', t.isha, nextFajr]].forEach(([key, s, e]) =>
        periods.push({ key, dayKey: days[i].dateKey, start: s.getTime(), end: e.getTime() }));
    }
    const tz = days[1].tz;
    if (periods.some(p => !isFinite(p.start) || !isFinite(p.end))) {
      return { valid: false, ymd: { ...ymd }, dateKey: ymdKey(ymd), tz, periods: [], windows: [], today: days[1], warnings: ['এই অক্ষাংশে কিছু সময় নির্ণয় করা যায়নি'] };
    }
    periods.sort((a, b) => a.start - b.start);
    for (let j = 0; j + 1 < periods.length; j++) {            // ওভারল্যাপ ছাঁটাই
      if (periods[j].end > periods[j + 1].start) { periods[j].end = periods[j + 1].start; warnings.push('overlap:' + periods[j].key); }
    }
    const kept = [];
    periods.forEach(p => { if (p.end > p.start) kept.push(p); else warnings.push('empty:' + p.key); });
    const windows = [];
    for (let i = 0; i < 3; i++) buildDayWindows({ c: days[i], t0: t0s[i] }, { c: days[i + 1], t0: t0s[i + 1] }, S, warnings)
      .forEach(w => windows.push(w));
    windows.sort((a, b) => a.start - b.start);
    return { valid: true, ymd: { ...ymd }, dateKey: ymdKey(ymd), tz, periods: kept, windows, t0: t0s[1], today: days[1], warnings };
  }

  // নির্দিষ্ট মুহূর্তে (epoch ms) অবস্থা: চলমান ওয়াক্ত, না থাকলে ফাঁক; পরবর্তী ওয়াক্ত; অবশিষ্ট সময়; অগ্রগতি।
  function timelineAt(plan, nowMs) {
    const P = plan.periods;
    if (!plan.valid || !P.length) return { state: 'none', now: nowMs };
    let idx = -1;
    for (let i = P.length - 1; i >= 0; i--) { if (nowMs >= P[i].start && nowMs < P[i].end) { idx = i; break; } }
    if (idx >= 0) {
      const cur = P[idx], total = cur.end - cur.start;
      return { state: 'waqt', now: nowMs, current: cur, next: P[idx + 1] || null,
               remainingMs: cur.end - nowMs, elapsedMs: nowMs - cur.start, totalMs: total,
               progress: clamp((nowMs - cur.start) / total, 0, 1) };
    }
    let prev = null, next = null;
    for (const p of P) { if (p.end <= nowMs) prev = p; else if (p.start > nowMs && !next) next = p; }
    if (!next) return { state: 'none', now: nowMs };
    const gapStart = prev ? prev.end : null, total = gapStart != null ? next.start - gapStart : 0;
    return { state: 'gap', now: nowMs, previous: prev, next, gapStart, gapEnd: next.start,
             remainingMs: next.start - nowMs, totalMs: total,
             progress: total > 0 ? clamp((nowMs - gapStart) / total, 0, 1) : 0,
             kind: (prev && prev.key === 'fajr') ? 'sunrise' : 'between' };
  }
  function timeline(nowMs, loc, settings) {
    const S = sanitizeSettings(settings || state.settings);
    const ymd = ymdInTz(new Date(nowMs), resolveTz(S));
    const plan = buildPlan(ymd, loc, S);
    return { plan, tl: timelineAt(plan, nowMs) };
  }
  // অবশিষ্ট সময় → ঘণ্টা/মিনিট/সেকেন্ড (উপরের দিকে রাউন্ড: শেষ মুহূর্তের আগে "০" দেখায় না)
  function splitDuration(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    return { h: Math.floor(total / 3600), m: Math.floor((total % 3600) / 60), s: total % 60, totalSeconds: total };
  }
  function dayDiff(a, b) { return Math.round((Date.UTC(b.y, b.m - 1, b.d) - Date.UTC(a.y, a.m - 1, a.d)) / 86400000); }


  // ═══════════ Phase 5: মসজিদ ও জামাতের সময় (ডেটা স্তর) ═══════════
  // জামাতের সময় সম্পূর্ণ ব্যবহারকারীর দেওয়া; অ্যাপ কোনো মসজিদের সময় অনুমান করে না। নতুন মসজিদের সব সময় খালি থাকে।
  // মসজিদের সংখ্যায় কোনো সীমা নেই। আলাদা কী-তে সংরক্ষিত, তাই নামাজ-সেটিংসের সাথে মিশে যায় না।
  const MOSQUE_KEY = 'ayatmil.mosques.v1';
  const JAMAAT_KEYS = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
  const HM_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
  let idSeq = 0;
  const newId = () => 'm' + Date.now().toString(36) + (++idSeq).toString(36);

  function sanitizeMosques(j) {
    const out = { mosques: [], selectedId: null };
    const seen = new Set();
    if (j && Array.isArray(j.mosques)) {
      for (const m of j.mosques) {
        if (!m || typeof m !== 'object') continue;
        const name = String(m.name == null ? '' : m.name).trim().slice(0, 60);
        if (!name) continue;
        let id = (typeof m.id === 'string' && /^[\w-]{1,40}$/.test(m.id)) ? m.id : null;
        if (!id || seen.has(id)) id = newId();
        seen.add(id);
        const jamaat = {};
        JAMAAT_KEYS.forEach(k => { const v = m.jamaat && m.jamaat[k]; jamaat[k] = (typeof v === 'string' && HM_RE.test(v)) ? v : ''; });
        out.mosques.push({ id, name, jamaat });
      }
    }
    const sid = j && j.selectedId;
    out.selectedId = out.mosques.some(x => x.id === sid) ? sid : (out.mosques[0] ? out.mosques[0].id : null);
    return out;
  }
  let mosqueMemory = null;
  function loadMosques() {
    let j = null;
    try { const raw = window.localStorage.getItem(MOSQUE_KEY); if (raw) j = JSON.parse(raw); } catch (e) { j = mosqueMemory; }
    if (!j || j.version !== 1) j = (mosqueMemory && mosqueMemory.version === 1) ? mosqueMemory : null;
    return sanitizeMosques(j);
  }
  let mosqueState = loadMosques();
  function persistMosques() {
    const payload = { version: 1, mosques: mosqueState.mosques, selectedId: mosqueState.selectedId, savedAt: Date.now() };
    mosqueMemory = payload;
    try { window.localStorage.setItem(MOSQUE_KEY, JSON.stringify(payload)); return true; } catch (e) { return false; }
  }
  const findMosque = id => mosqueState.mosques.find(x => x.id === id) || null;
  const selectedMosque = () => findMosque(mosqueState.selectedId);
  const cleanName = n => String(n == null ? '' : n).trim().slice(0, 60);

  function addMosque(name) {
    const nm = cleanName(name);
    if (!nm) return { ok: false, error: 'empty' };
    const jamaat = {}; JAMAAT_KEYS.forEach(k => { jamaat[k] = ''; });
    const m = { id: newId(), name: nm, jamaat };
    mosqueState.mosques.push(m); mosqueState.selectedId = m.id;
    return { ok: true, saved: persistMosques(), id: m.id };
  }
  function renameMosque(id, name) {
    const m = findMosque(id), nm = cleanName(name);
    if (!m) return { ok: false, error: 'missing' };
    if (!nm) return { ok: false, error: 'empty' };
    m.name = nm; return { ok: true, saved: persistMosques() };
  }
  function removeMosque(id) {
    const i = mosqueState.mosques.findIndex(x => x.id === id);
    if (i < 0) return { ok: false, error: 'missing' };
    mosqueState.mosques.splice(i, 1);
    if (mosqueState.selectedId === id) mosqueState.selectedId = mosqueState.mosques[Math.min(i, mosqueState.mosques.length - 1)] ? mosqueState.mosques[Math.min(i, mosqueState.mosques.length - 1)].id : null;
    return { ok: true, saved: persistMosques() };
  }
  function selectMosque(id) {
    if (!findMosque(id)) return { ok: false, error: 'missing' };
    mosqueState.selectedId = id; return { ok: true, saved: persistMosques() };
  }
  function setJamaat(id, key, hhmm) {
    const m = findMosque(id);
    if (!m || JAMAAT_KEYS.indexOf(key) < 0) return { ok: false, error: 'missing' };
    const v = String(hhmm == null ? '' : hhmm).trim();
    if (v !== '' && !HM_RE.test(v)) return { ok: false, error: 'format' };
    m.jamaat[key] = v; return { ok: true, saved: persistMosques() };
  }

  // নির্বাচিত সময় অঞ্চলে "HH:MM" → পরম মুহূর্ত (epoch ms)
  function tzOffsetMs(tz, ms) {
    try {
      const p = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(new Date(ms));
      const g = t => Number(p.find(x => x.type === t).value);
      return Date.UTC(g('year'), g('month') - 1, g('day'), g('hour'), g('minute'), g('second')) - Math.floor(ms / 1000) * 1000;
    } catch (e) { return tz === DHAKA_TZ ? 6 * 3600000 : -new Date(ms).getTimezoneOffset() * 60000; }
  }
  function zonedMs(ymd, hhmm, tz) {
    const [h, mi] = hhmm.split(':').map(Number);
    const guess = Date.UTC(ymd.y, ymd.m - 1, ymd.d, h, mi);
    let t = guess - tzOffsetMs(tz, guess);
    t = guess - tzOffsetMs(tz, t);
    return t;
  }

  // জামাতের অবস্থা (ওয়াক্তের কাউন্টডাউন থেকে সম্পূর্ণ স্বাধীন; শুধু ওয়াক্তের সীমা পড়ে):
  //   rows[k].state : upcoming (কাউন্টডাউন চলছে) | started (জামাত শুরু হয়েছে, ওয়াক্ত শেষ হয়নি) | past | none (সময় দেওয়া নেই)
  //   next    : পরবর্তী জামাত (আজ শেষ হলে আগামীকালেরটি)
  //   started : সর্বশেষ শুরু হওয়া জামাত, যার ওয়াক্ত এখনো চলছে (মধ্যরাতের পর গতকালের ইশাও ধরা হয়)
  function jamaatStatus(plan, mosque, nowMs) {
    const res = { rows: {}, next: null, started: null };
    if (!plan || !plan.valid || !mosque) return res;
    const evs = [];
    [-1, 0, 1].forEach(off => {
      const ymd = addDays(plan.ymd, off), dk = ymdKey(ymd);
      JAMAAT_KEYS.forEach(k => {
        const hm = mosque.jamaat[k]; if (!hm) return;
        const per = plan.periods.find(p => p.key === k && p.dayKey === dk);
        evs.push({ key: k, dayKey: dk, off, ts: zonedMs(ymd, hm, plan.tz), ws: per ? per.start : null, we: per ? per.end : null });
      });
    });
    JAMAAT_KEYS.forEach(k => {
      const e = evs.find(x => x.key === k && x.off === 0);
      if (!e) { res.rows[k] = { state: 'none' }; return; }
      const outside = e.ws != null && (e.ts < e.ws || e.ts >= e.we);
      const state = nowMs < e.ts ? 'upcoming' : (e.we != null && nowMs < e.we ? 'started' : 'past');
      res.rows[k] = { state, ts: e.ts, remainingMs: e.ts - nowMs, outside, waqtStart: e.ws, waqtEnd: e.we };
    });
    const up = evs.filter(e => e.ts > nowMs).sort((a, b) => a.ts - b.ts)[0];
    if (up) res.next = { key: up.key, dayKey: up.dayKey, ts: up.ts, remainingMs: up.ts - nowMs };
    const st = evs.filter(e => e.ts <= nowMs && e.we != null && nowMs < e.we).sort((a, b) => b.ts - a.ts)[0];
    if (st) res.started = { key: st.key, dayKey: st.dayKey, ts: st.ts, waqtEnd: st.we };
    return res;
  }


  // ═══════════ Phase 6: ইংরেজি, বাংলা (বঙ্গাব্দ) ও হিজরি তারিখ ═══════════
  // সব তারিখ চলতি তারিখ (নির্বাচিত সময় অঞ্চলের) থেকে গণনা করা; কিছুই স্থায়ীভাবে বসানো নয়।
  const EN_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const EN_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function enDate(ymd) {
    const w = new Date(Date.UTC(ymd.y, ymd.m - 1, ymd.d, 12)).getUTCDay();
    return EN_DAYS[w] + ', ' + ymd.d + ' ' + EN_MONTHS[ymd.m - 1] + ' ' + ymd.y;
  }

  // বাংলাদেশের সংশোধিত বাংলা ক্যালেন্ডার (বাংলা একাডেমি, ২০১৯): বৈশাখ–আশ্বিন ৩১ দিন, কার্তিক–মাঘ ৩০,
  // ফাল্গুন ২৯ (গ্রেগরিয়ান লিপ ইয়ারে ৩০), চৈত্র ৩০। প্রতিটি মাসের শুরু গ্রেগরিয়ান [মাস, দিন]-এ স্থির;
  // ফলে ২১ ফেব্রুয়ারি = ৮ ফাল্গুন, ২৬ মার্চ = ১২ চৈত্র, ১৪ এপ্রিল = ১ বৈশাখ, ১৬ ডিসেম্বর = ১ পৌষ। দিন শুরু মধ্যরাতে।
  const BN_MONTHS = ['বৈশাখ', 'জ্যৈষ্ঠ', 'আষাঢ়', 'শ্রাবণ', 'ভাদ্র', 'আশ্বিন', 'কার্তিক', 'অগ্রহায়ণ', 'পৌষ', 'মাঘ', 'ফাল্গুন', 'চৈত্র'];
  const BN_STARTS = [[4, 14], [5, 15], [6, 15], [7, 16], [8, 16], [9, 16], [10, 17], [11, 16], [12, 16], [1, 15], [2, 14], [3, 15]];
  function banglaFor(ymd) {
    const t = Date.UTC(ymd.y, ymd.m - 1, ymd.d);
    let best = null;
    for (let yy = ymd.y - 1; yy <= ymd.y; yy++) {
      BN_STARTS.forEach((s, i) => { const st = Date.UTC(yy, s[0] - 1, s[1]); if (st <= t && (!best || st > best.t)) best = { t: st, i }; });
    }
    if (!best) return null;
    const year = (ymd.m > 4 || (ymd.m === 4 && ymd.d >= 14)) ? ymd.y - 593 : ymd.y - 594;
    return { d: Math.round((t - best.t) / 86400000) + 1, m: best.i, y: year };
  }

  // হিজরি: ব্রাউজারের Intl (উম্মুল কুরা)। চাঁদ দেখার কারণে বাংলাদেশে ±১ দিন পার্থক্য হতে পারে, তাই adj (−১/০/+১)।
  // ক্যালেন্ডার সমর্থিত না হলে অনুমান না করে null (তারিখ লুকানো থাকে)।
  const HIJRI_MONTHS_BN = ['মুহাররম', 'সফর', 'রবিউল আউয়াল', 'রবিউস সানি', 'জমাদিউল আউয়াল', 'জমাদিউস সানি', 'রজব', 'শাবান', 'রমজান', 'শাওয়াল', 'জিলকদ', 'জিলহজ'];
  function hijriFor(ymd, adj) {
    try {
      const fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { timeZone: 'UTC', year: 'numeric', month: 'numeric', day: 'numeric' });
      if (fmt.resolvedOptions().calendar !== 'islamic-umalqura') return null;
      const parts = fmt.formatToParts(new Date(Date.UTC(ymd.y, ymd.m - 1, ymd.d + (adj || 0), 12)));
      const get = t => parseInt((parts.find(p => p.type === t) || {}).value, 10);
      const y = get('year'), mo = get('month'), d = get('day');
      return (y > 1000 && mo >= 1 && mo <= 12 && d >= 1 && d <= 30) ? { y, m: mo, d } : null;
    } catch (e) { return null; }
  }

  // ───────── জিপিএস ─────────
  function locateGPS() {
    return new Promise((resolve, reject) => {
      if (!('geolocation' in navigator)) { reject({ code: 'unsupported' }); return; }
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
        err => reject({ code: err.code === 1 ? 'denied' : err.code === 2 ? 'unavailable' : 'timeout', message: err.message }),
        { enableHighAccuracy: false, timeout: 15000, maximumAge: 10 * 60 * 1000 }
      );
    });
  }

  // ───────── সময় ফরম্যাট ─────────
  function fmtTime(date, tz) {
    if (!(date instanceof Date) || !isFinite(date.getTime())) return '—';
    try {
      return new Intl.DateTimeFormat('bn-BD', { timeZone: tz, hour: 'numeric', minute: '2-digit',
        hour12: true, numberingSystem: 'beng' }).format(date);
    } catch (e) {
      return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(date);
    }
  }
  function fmtTime24(date, tz) {
    try { return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(date); }
    catch (e) { return '--:--'; }
  }
  function fmtDateBn(ymd, tz) {
    try {
      return new Intl.DateTimeFormat('bn-BD', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long',
        year: 'numeric', numberingSystem: 'beng' }).format(new Date(Date.UTC(ymd.y, ymd.m - 1, ymd.d)));
    } catch (e) { return ymdKey(ymd); }
  }
  function bn(n) { return String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]); }

          <button type="button" class="pt-btn pt-btn-sm" id="pt-d-today">আজ</button>

    // ───── বিদ্যমান অবস্থা ফর্মে ─────
    const ids = {
      method: $(root, '#pt-s-method'), fajr: $(root, '#pt-s-fajr'), isha: $(root, '#pt-s-isha'), interval: $(root, '#pt-s-interval'),
      asr: $(root, '#pt-s-asr'), hl: $(root, '#pt-s-hl'), tz: $(root, '#pt-s-tz')
    };
    let viewYmd = todayYMD();

    function fillSettingsForm() {
      const s = state.settings;
      ids.method.value = s.method; ids.fajr.value = s.fajrAngle; ids.isha.value = s.ishaAngle; ids.interval.value = s.ishaInterval;
      ids.asr.value = s.asr; ids.hl.value = s.highLat; ids.tz.value = s.tzMode;
      PRAYER_KEYS.forEach(k => { $(root, '#pt-a-' + k).value = s.adjustments[k]; });
      $(root, '#pt-moon-hint').hidden = (s.method !== 'MoonsightingCommittee');
    }
    function renderLocation() {
      const L = state.location, box = $(root, '#pt-loc-summary');
      box.textContent = '';
      const top = el('div', 'pt-loc-top');
      top.appendChild(el('span', 'pt-loc-name', L.name));
      const srcLabel = { default: 'ডিফল্ট', gps: 'জিপিএস', manual: 'ম্যানুয়াল' }[L.source];
      top.appendChild(el('span', 'pt-badge pt-badge-' + L.source, srcLabel));
      box.appendChild(top);
      box.appendChild(el('div', 'pt-loc-coords', `অক্ষাংশ ${bn(L.lat.toFixed(4))}, দ্রাঘিমাংশ ${bn(L.lng.toFixed(4))} · সময় অঞ্চল ${resolveTz(state.settings)}`));
      if (L.source === 'default') box.appendChild(el('div', 'pt-warn', 'আপনি এখনো লোকেশন সেট করেননি; আপাতত ঢাকার কেন্দ্রের স্থানাঙ্ক ব্যবহার হচ্ছে। নির্ভুল সময়ের জন্য জিপিএস বা ম্যানুয়াল লোকেশন দিন।'));
      const inBD = L.lat >= 20.5 && L.lat <= 26.7 && L.lng >= 88.0 && L.lng <= 92.8;
      if (!inBD && state.settings.tzMode === 'dhaka') box.appendChild(el('div', 'pt-warn', 'এই স্থানাঙ্ক বাংলাদেশের বাইরে, কিন্তু সময় অঞ্চল Asia/Dhaka ধরা আছে। প্রয়োজনে সেটিংস থেকে "ডিভাইসের সময় অঞ্চল" বেছে নিন।'));
      $(root, '#pt-m-name').value = L.source === 'default' ? '' : L.name;
      $(root, '#pt-m-lat').value = L.lat; $(root, '#pt-m-lng').value = L.lng;
      if (liveReady) refreshLive();
    }
    function renderResult() {
      let res;
      try { res = compute(viewYmd); } catch (e) { res = null; }
      const tbody = $(root, '#pt-table tbody'); tbody.textContent = '';
      $(root, '#pt-d-input').value = ymdKey(viewYmd);
      $(root, '#pt-d-label').textContent = fmtDateBn(viewYmd, resolveTz(state.settings));
      if (!res) { $(root, '#pt-meta').textContent = 'গণনা করা যায়নি।'; return; }
      ROWS.forEach(([k, bnName, enName]) => {
        const tr = el('tr'); const t = res.times[k];
        const th = el('th'); th.appendChild(el('span', 'pt-pn', bnName)); th.appendChild(el('span', 'pt-pe', enName));
        const td = el('td', 'pt-time', fmtTime(t, res.tz));
        td.dataset.key = k; td.dataset.ts = isFinite(t.getTime()) ? String(t.getTime()) : '';
        td.dataset.hm = fmtTime24(t, res.tz);
        tr.appendChild(th); tr.appendChild(td); tbody.appendChild(tr);
      });
      const p = res.params, S = res.settings;
      const adj = PRAYER_KEYS.filter(k => S.adjustments[k]).map(k => `${k} ${S.adjustments[k] > 0 ? '+' : ''}${S.adjustments[k]}`).join(', ');
      $(root, '#pt-meta').textContent =
        `পদ্ধতি: ${S.method} · ফজর ${bn(p.fajrAngle)}° · ইশা ${p.ishaInterval > 0 ? bn(p.ishaInterval) + ' মিনিট (মাগরিবের পর)' : bn(p.ishaAngle) + '°'}` +
        ` · আসর: ${S.asr === 'hanafi' ? 'হানাফি' : 'শাফিয়ি'} · সময় অঞ্চল ${res.tz}` +
        (adj ? ` · সমন্বয় (মিনিট): ${adj}` : '') + (res.valid ? '' : ' · ⚠ এই অক্ষাংশে কিছু সময় নির্ণয় করা যায়নি') +
        ` · ইঞ্জিন: ${res.engine}`;
    }

    // ───── লোকেশন ইভেন্ট ─────
    const locMsg = (t, kind) => { const m = $(root, '#pt-loc-msg'); m.textContent = t || ''; m.className = 'pt-msg' + (kind ? ' pt-msg-' + kind : ''); };
    const setMsg = (t, kind) => { const m = $(root, '#pt-set-msg'); m.textContent = t || ''; m.className = 'pt-msg' + (kind ? ' pt-msg-' + kind : ''); };

    const gpsBtn = $(root, '#pt-gps');
    gpsBtn.addEventListener('click', async () => {
      gpsBtn.disabled = true; locMsg('লোকেশন খোঁজা হচ্ছে…');
      try {
        const g = await locateGPS();
        const r = setLocation({ lat: g.lat, lng: g.lng, name: 'জিপিএস লোকেশন', source: 'gps' });
        renderLocation(); renderResult();
        locMsg(r.ok ? 'জিপিএস লোকেশন সংরক্ষিত হয়েছে।' : 'লোকেশন পাওয়া গেছে, কিন্তু স্থায়ীভাবে সংরক্ষণ করা যায়নি (ব্রাউজারে স্টোরেজ বন্ধ থাকতে পারে)।', r.ok ? 'ok' : 'warn');
      } catch (e) {
        const hint = (!window.isSecureContext ? ' (জিপিএসের জন্য https বা নিরাপদ সংযোগ লাগতে পারে)' : '');
        locMsg({ denied: 'লোকেশনের অনুমতি দেওয়া হয়নি। ম্যানুয়ালি লোকেশন দিন।' + hint,
                 unavailable: 'ডিভাইস লোকেশন দিতে পারছে না। ম্যানুয়ালি লোকেশন দিন।',
                 timeout: 'লোকেশন পেতে বেশি সময় লাগছে। আবার চেষ্টা করুন বা ম্যানুয়ালি দিন।',
                 unsupported: 'এই ব্রাউজারে জিপিএস সমর্থিত নয়। ম্যানুয়ালি লোকেশন দিন।' }[e.code] || 'লোকেশন পাওয়া যায়নি।', 'err');
      } finally { gpsBtn.disabled = false; }
    });
    const tgl = $(root, '#pt-manual-toggle'), man = $(root, '#pt-manual');
    tgl.addEventListener('click', () => { man.hidden = !man.hidden; tgl.setAttribute('aria-expanded', String(!man.hidden)); });
    const cities = $(root, '#pt-cities');
    CITIES.forEach(([n, la, lo]) => {
      const b = el('button', 'pt-chip', n); b.type = 'button';
      b.addEventListener('click', () => { $(root, '#pt-m-name').value = n; $(root, '#pt-m-lat').value = la; $(root, '#pt-m-lng').value = lo; });
      cities.appendChild(b);
    });
    $(root, '#pt-m-save').addEventListener('click', () => {
      const lat = num($(root, '#pt-m-lat').value, NaN), lng = num($(root, '#pt-m-lng').value, NaN);
      if (!(lat >= -90 && lat <= 90) || !(lng >= -180 && lng <= 180)) { locMsg('অক্ষাংশ (−৯০ থেকে ৯০) ও দ্রাঘিমাংশ (−১৮০ থেকে ১৮০) সঠিকভাবে দিন।', 'err'); return; }
      const r = setLocation({ lat, lng, name: $(root, '#pt-m-name').value, source: 'manual' });
      renderLocation(); renderResult();
      locMsg(r.ok ? 'লোকেশন সংরক্ষিত হয়েছে।' : 'ব্যবহার হচ্ছে, কিন্তু স্থায়ীভাবে সংরক্ষণ করা যায়নি।', r.ok ? 'ok' : 'warn');
    });

    // ───── সেটিংস ইভেন্ট ─────
    ids.method.addEventListener('change', () => {
      const m = ids.method.value;
      if (m !== 'Other') { const p = methodPreset(m); ids.fajr.value = p.fajrAngle; ids.isha.value = p.ishaAngle; ids.interval.value = p.ishaInterval; }
      $(root, '#pt-moon-hint').hidden = (m !== 'MoonsightingCommittee');
      setMsg('পদ্ধতির প্রিসেট মান বসানো হয়েছে। "সংরক্ষণ" চাপলে প্রয়োগ হবে।');
    });
    $(root, '#pt-s-save').addEventListener('click', () => {
      const fa = num(ids.fajr.value, NaN), ia = num(ids.isha.value, NaN), iv = num(ids.interval.value, NaN);

      if (!(iv >= 0 && iv <= 180)) { setMsg('ইশার ব্যবধান ০ থেকে ১৮০ মিনিটের মধ্যে হতে হবে।', 'err'); return; }
      const adjustments = {};
      for (const k of PRAYER_KEYS) {
        const v = num($(root, '#pt-a-' + k).value, NaN);
        if (!(v >= -60 && v <= 60)) { setMsg('মিনিট সমন্বয় −৬০ থেকে +৬০ এর মধ্যে হতে হবে।', 'err'); return; }
        adjustments[k] = v;
      }
      const r = setSettings({ ...state.settings, method: ids.method.value, fajrAngle: fa, ishaAngle: ia, ishaInterval: iv, asr: ids.asr.value,
                              highLat: ids.hl.value, tzMode: ids.tz.value, adjustments });
      viewYmd = todayYMD();
      fillSettingsForm(); renderLocation(); renderResult();
      setMsg(r.ok ? 'সেটিংস সংরক্ষিত হয়েছে।' : 'সেটিংস প্রয়োগ হয়েছে, কিন্তু স্থায়ীভাবে সংরক্ষণ করা যায়নি।', r.ok ? 'ok' : 'warn');
    });
    $(root, '#pt-s-reset').addEventListener('click', () => {
      const r = setSettings({ ...clone(DEFAULT_SETTINGS), makruh: state.settings.makruh, nafl: state.settings.nafl, hijriAdjust: state.settings.hijriAdjust }); viewYmd = todayYMD();
      fillSettingsForm(); renderLocation(); renderResult();
      setMsg(r.ok ? 'ডিফল্ট সেটিংস (কারাচি + হানাফি) ফিরিয়ে আনা হয়েছে।' : 'ডিফল্টে ফেরা হয়েছে, কিন্তু সংরক্ষণ করা যায়নি।', r.ok ? 'ok' : 'warn');
    });

    // ───── তারিখ নেভিগেশন ─────
    const dInput = $(root, '#pt-d-input');
    dInput.addEventListener('change', () => { const y = parseYmd(dInput.value); if (y) { viewYmd = y; renderResult(); } else dInput.value = ymdKey(viewYmd); });
    $(root, '#pt-d-prev').addEventListener('click', () => { viewYmd = addDays(viewYmd, -1); renderResult(); });
    $(root, '#pt-d-next').addEventListener('click', () => { viewYmd = addDays(viewYmd, 1); renderResult(); });
    $(root, '#pt-d-today').addEventListener('click', () => { viewYmd = todayYMD(); renderResult(); });


    // ═══════════ Phase 3: লাইভ ওয়াক্ত, কাউন্টডাউন, প্রগ্রেস বার ═══════════
    let livePlan = null, livePlanKey = '', liveTimer = null, liveReady = false;
    const N = {
      date: $(root, '#pt-now-date'), loc: $(root, '#pt-now-loc'), state: $(root, '#pt-now-state'), name: $(root, '#pt-now-name'),
      label: $(root, '#pt-now-label'), count: $(root, '#pt-count'), bar: $(root, '#pt-bar'), fill: $(root, '#pt-bar-fill'),
      bs: $(root, '#pt-bar-start'), bp: $(root, '#pt-bar-pct'), be: $(root, '#pt-bar-end'), next: $(root, '#pt-next'),
      note: $(root, '#pt-now-note'), body: $(root, '#pt-waqt-table tbody'), hint: $(root, '#pt-waqt-hint')
    };
    function dayWord(ms, plan) {
      const d = dayDiff(plan.ymd, ymdInTz(new Date(ms), plan.tz));
      return d === 0 ? '' : d < 0 ? 'গতকাল ' : 'পরদিন ';
    }
    const tm = (ms, plan) => dayWord(ms, plan) + fmtTime(new Date(ms), plan.tz);

    function renderDaily(plan) {
      N.body.textContent = '';
      if (!plan.valid) { const tr = el('tr'); const td = el('td', 'pt-warn', plan.warnings[0]); td.colSpan = 3; tr.appendChild(td); N.body.appendChild(tr); return; }
      const mine = {}; plan.periods.forEach(p => { if (p.dayKey === plan.dateKey) mine[p.key] = p; });
      const t = plan.today.times;
      WAQT.forEach(w => {
        const p = mine[w.key];
        const tr = el('tr'); tr.dataset.key = w.key;

          const sr = el('tr', 'pt-sunrise-row'); sr.dataset.key = 'sunrise';

          td.appendChild(el('span', 'pt-sr-name', 'সূর্যোদয় '));

          td.appendChild(el('span', 'pt-sr-note', ' — ফজরের ওয়াক্ত শেষ; যোহর শুরু পর্যন্ত কোনো ফরজ ওয়াক্ত নেই'));
          sr.appendChild(td); N.body.appendChild(sr);
        }
      });
      N.hint.textContent = (plan.today.settings.asr === 'hanafi'
        ? 'যোহরের ওয়াক্ত আসর শুরু (হানাফি: ছায়া দ্বিগুণ) পর্যন্ত; '
        : 'যোহরের ওয়াক্ত আসর শুরু (শাফিয়ি: ছায়া সমান) পর্যন্ত; ') +
        'আসর সূর্যাস্ত পর্যন্ত; মাগরিব ইশার শুরু পর্যন্ত; ইশা পরদিন ফজর শুরু পর্যন্ত।';
      if (plan.warnings.length) N.hint.textContent += ' ⚠ মিনিট-সমন্বয়ের কারণে কিছু ওয়াক্তের সীমা সংশোধিত হয়েছে।';
    }

    function setCount(ms) {
      const d = splitDuration(ms), parts = [];
      const add = (v, unit) => { parts.push('<span class="pt-cn">' + bn(pad2(v)) + '</span> <span class="pt-cu">' + unit + '</span>'); };
      if (d.h > 0) add(d.h, 'ঘণ্টা');
      if (d.h > 0 || d.m > 0) add(d.m, 'মিনিট');
      add(d.s, 'সেকেন্ড');
